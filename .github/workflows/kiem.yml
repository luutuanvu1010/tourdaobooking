# Lượt kiểm ĐỦ BỘ trên máy GitHub (ADR-0176). `npm run day-len` đẩy đúng commit sắp lên main vào nhánh `cho-kiem/<mã commit>`, chờ lượt này xanh rồi mới
# hỏi đẩy main; `npm run trien-khai` chỉ ĐỌC kết quả (check-run của ứng dụng GitHub Actions, đúng commit, việc "Gom kết quả kiểm" xanh, ≤ 24 giờ).
# KHÔNG chạy khi đẩy main (cùng commit đã kiểm ở nhánh cho-kiem — không kiểm hai lần, Đ1.5). Bảng chia + máy gom: scripts/kiem-phan.mjs.
# Tệp LUẬT + tệp điều khiển việc kiểm (Đ2.3, Đ2.6): chỉ sửa bằng công cụ sửa tệp để chủ được hỏi; đổi nó thì day-len đòi chủ gõ lý do.
name: Kiểm đủ bộ

on:
  push:
    branches: ["cho-kiem/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiem-${{ github.sha }}
  cancel-in-progress: false

env:
  CI: "1"
  NODE_VERSION: "22"

jobs:
  chia:
    name: Chia phần
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.bang.outputs.test }}
      e2e: ${{ steps.bang.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Đỏ nếu hợp các phần ≠ toàn bộ, trùng, thiếu bước riêng, ít phần hơn mức tối thiểu.
      - id: bang
        run: node scripts/kiem-phan.mjs ma-tran >> "$GITHUB_OUTPUT"

  rieng:
    name: Phần riêng (Bước 0, typecheck, bài đo giờ)
    needs: chia
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: mkdir -p bao-cao && node scripts/kiem-phan.mjs rieng --ket-qua bao-cao/rieng.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-rieng
          path: bao-cao/rieng.json
          if-no-files-found: ignore

  test:
    name: npm test phần ${{ matrix.phan }}
    needs: chia
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        phan: ${{ fromJSON(needs.chia.outputs.test) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: mkdir -p bao-cao && node scripts/kiem-phan.mjs test ${{ matrix.phan }} --ket-qua bao-cao/test-${{ matrix.phan }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-test-${{ matrix.phan }}
          path: bao-cao/test-${{ matrix.phan }}.json
          if-no-files-found: ignore

  e2e:
    name: e2e phần ${{ matrix.phan }}
    needs: chia
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phan: ${{ fromJSON(needs.chia.outputs.e2e) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Một D1 tạm + một wrangler dev cho phần này; audit-invariants --strict cuối phần (tests/e2e/run.mjs --phan). Cần mạng: Sheet thật, siteverify.
      - run: mkdir -p bao-cao && node tests/e2e/run.mjs --phan ${{ matrix.phan }} --ket-qua bao-cao/e2e-${{ matrix.phan }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bao-cao-e2e-${{ matrix.phan }}
          path: bao-cao/e2e-${{ matrix.phan }}.json
          if-no-files-found: ignore

  gom:
    # TÊN việc này là hợp đồng với scripts/release-lib.mjs (VIEC_GOM) — đổi tên ở cả hai nơi.
    name: Gom kết quả kiểm
    needs: [chia, rieng, test, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: bao-cao-*
          path: bao-cao
          merge-multiple: true
        continue-on-error: true
      - run: mkdir -p bao-cao && node scripts/kiem-phan.mjs gom bao-cao --ket-qua ket-qua-tong.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-tong
          path: ket-qua-tong.json
          if-no-files-found: ignore
