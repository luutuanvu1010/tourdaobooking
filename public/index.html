<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0c4a6e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Tour Đảo"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><title>Đơn hàng — Tour Đảo Booking</title></head>
<body>
<header id="topbar"></header>
<main>
  <h1>Đơn hàng</h1>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Tìm mã đơn, tên, SĐT…" autocomplete="off">
    <select id="status" aria-label="Lọc trạng thái">
      <option value="">Mọi trạng thái</option><option value="draft">Nháp</option><option value="confirmed">Đã xác nhận</option><option value="cancelled">Đã huỷ</option>
    </select>
    <a id="new-order" class="btn btn-primary" href="/order-form" hidden>+ Đơn mới</a>
  </div>
  <div id="error" class="alert" role="alert" hidden></div>
  <div id="list"></div>
  <p id="empty" class="empty" hidden>Chưa có đơn nào khớp.</p>
  <button id="more" class="btn" type="button" hidden>Tải thêm</button>
</main>
<script type="module" src="/js/orders.js"></script>
</body></html>
