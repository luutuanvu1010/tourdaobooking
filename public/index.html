<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/giao-dien.css"><title>Trang chủ — Island Booking System</title></head>
<body class="trang-chu">
<header id="topbar"></header>
<main>
  <!-- Bản mẫu không có H1 to trên trang (khung có sẵn của trang này chưa có thanh tiêu đề như bản mẫu sidebar — đó là việc của Đợt D khác) — h1 chỉ còn phục vụ trình đọc màn hình, ẩn khỏi mắt ở MỌI khổ (cùng kỹ thuật với .detail-head h1). -->
  <h1 class="visually-hidden">Trang chủ</h1>
  <!-- Lời chào MÁY TÍNH (≥641px — bản vẽ "Trang chu Quan tri.dc.html", Claude Design 2026-10-02, bản 1.73): ngày, lời chào theo buổi, tóm tắt, viên bảo trì, nhãn vai.
       Không còn lưới ô chức năng (đã có ở thanh bên) — lối tắt ở thẻ #dash-loi-tat. web/home.ts dựng nội dung; điện thoại ẩn. -->
  <section id="dash-dai" class="dash-dai" aria-label="Lời chào" hidden></section>
  <!-- Trang chủ điện thoại (≤640px — bản vẽ "Trang chu dien thoai.dc.html" 1a–1g, lưới 4 ô theo bản 1.73): ô tìm đơn nổi trên dải đầu trang, lưới ô chức năng, khối số liệu 2×2.
       Máy tính ẩn ba khối này (CSS) — lời chào của máy tính ở #dash-dai, số liệu ở #dash-so-mt. Lời chào / chuông / trợ giúp của dải đầu trang nằm trong #topbar (web/home.ts chèn sau initShell). -->
  <form id="dash-tim" class="dash-tim" role="search">
    <span class="dash-tim-ico" aria-hidden="true"></span>
    <input id="dash-tim-o" type="search" enterkeyhint="search" autocomplete="off" placeholder="Tìm mã đơn, tên khách, SĐT…" aria-label="Tìm đơn">
  </form>
  <nav id="dash-o" class="dash-o" aria-label="Chức năng" hidden></nav>
  <div id="error" class="alert" role="alert" hidden></div>
  <div id="loading" class="skeleton-list" aria-hidden="true">
    <div class="dash-xuong">
      <div class="dash-xuong-so">
        <div><span class="dash-xg dash-xg-a"></span><span class="dash-xg dash-xg-so"></span><span class="dash-xg dash-xg-b"></span></div>
        <div><span class="dash-xg dash-xg-a"></span><span class="dash-xg dash-xg-so"></span><span class="dash-xg dash-xg-b"></span></div>
        <div><span class="dash-xg dash-xg-a"></span><span class="dash-xg dash-xg-so"></span><span class="dash-xg dash-xg-b"></span></div>
        <div><span class="dash-xg dash-xg-a"></span><span class="dash-xg dash-xg-so"></span><span class="dash-xg dash-xg-b"></span></div>
      </div>
      <div class="dash-xuong-chuyen">
        <span class="dash-xg dash-xg-tieu-de"></span>
        <div class="dash-xuong-vien"><span class="dash-xg dash-xg-vien"></span><span class="dash-xg dash-xg-vien"></span><span class="dash-xg dash-xg-vien"></span></div>
        <div class="dash-xuong-dong"><span class="dash-xg dash-xg-gio"></span><div><span class="dash-xg dash-xg-ten"></span><span class="dash-xg dash-xg-phu"></span></div><span class="dash-xg dash-xg-tien"></span></div>
        <div class="dash-xuong-dong"><span class="dash-xg dash-xg-gio"></span><div><span class="dash-xg dash-xg-ten"></span><span class="dash-xg dash-xg-phu"></span></div><span class="dash-xg dash-xg-tien"></span></div>
        <div class="dash-xuong-dong"><span class="dash-xg dash-xg-gio"></span><div><span class="dash-xg dash-xg-ten"></span><span class="dash-xg dash-xg-phu"></span></div><span class="dash-xg dash-xg-tien"></span></div>
      </div>
    </div>
    <!-- Khung xương máy tính (bản vẽ v2 "Đang tải"): thẻ Chuyến đón + thẻ số liệu, cùng lưới với nội dung thật. -->
    <!-- Khung xương "Việc của bạn" (máy tính): 4 thẻ cùng chiều cao với thẻ thật để trang không nhảy bố cục khi dữ liệu về. -->
    <div class="dash-xuong-viec">
      <div class="dash-xuong-viec-the"><span class="dash-xg dash-xg-tieu-de"></span><span class="dash-xg dash-xg-so"></span><span class="dash-xg dash-xg-b"></span><span class="dash-xg dash-xg-vien"></span></div>
      <div class="dash-xuong-viec-the"><span class="dash-xg dash-xg-tieu-de"></span><span class="dash-xg dash-xg-so"></span><span class="dash-xg dash-xg-b"></span><span class="dash-xg dash-xg-vien"></span></div>
      <div class="dash-xuong-viec-the"><span class="dash-xg dash-xg-tieu-de"></span><span class="dash-xg dash-xg-so"></span><span class="dash-xg dash-xg-b"></span><span class="dash-xg dash-xg-vien"></span></div>
      <div class="dash-xuong-viec-the"><span class="dash-xg dash-xg-tieu-de"></span><span class="dash-xg dash-xg-so"></span><span class="dash-xg dash-xg-b"></span><span class="dash-xg dash-xg-vien"></span></div>
    </div>
    <div class="dash-xuong-mt">
      <div class="dash-xuong-mt-chuyen">
        <span class="dash-xg dash-xg-tieu-de"></span>
        <div class="dash-xuong-vien"><span class="dash-xg dash-xg-vien"></span><span class="dash-xg dash-xg-vien"></span><span class="dash-xg dash-xg-vien"></span></div>
        <span class="dash-xg dash-xg-truc"></span>
        <div class="dash-xuong-mt-dong"><div><span class="dash-xg dash-xg-gio"></span><span class="dash-xg dash-xg-phu"></span></div><div><span class="dash-xg dash-xg-ten"></span><span class="dash-xg dash-xg-phu"></span></div><span class="dash-xg dash-xg-tien"></span></div>
        <div class="dash-xuong-mt-dong"><div><span class="dash-xg dash-xg-gio"></span><span class="dash-xg dash-xg-phu"></span></div><div><span class="dash-xg dash-xg-ten"></span><span class="dash-xg dash-xg-phu"></span></div><span class="dash-xg dash-xg-tien"></span></div>
        <div class="dash-xuong-mt-dong"><div><span class="dash-xg dash-xg-gio"></span><span class="dash-xg dash-xg-phu"></span></div><div><span class="dash-xg dash-xg-ten"></span><span class="dash-xg dash-xg-phu"></span></div><span class="dash-xg dash-xg-tien"></span></div>
      </div>
      <div class="dash-xuong-mt-so">
        <div><span class="dash-xg dash-xg-a"></span><span class="dash-xg dash-xg-so"></span><span class="dash-xg dash-xg-b"></span></div>
      </div>
    </div>
  </div>
  <div id="dash-so" class="dash-so" hidden></div>
  <!-- "Việc của bạn" (chỉ máy tính ≥641px, bốn vai văn phòng; điện thoại ẩn bằng CSS và vẫn dùng #dash-so): thẻ việc có số, mỗi thẻ một nút làm tiếp. web/home.ts dựng nội dung
       từ src/shared/viec-cua-ban.ts; ẩn tới khi nguồn số đã về (cùng lúc với #dash-grid, không nhấp nháy). -->
  <section id="dash-viec" class="dash-viec" aria-labelledby="dash-viec-h" hidden></section>
  <div id="dash-grid" class="dash-grid" hidden>
    <!-- Thứ tự DOM = thứ tự đọc ở điện thoại và máy tính một cột (bản vẽ 1.73): số liệu → Cần xem lại → Chuyến đón → Lối tắt. Hai cột (≥1200px) đặt chỗ bằng
         grid-template-areas, không dùng CSS order (bài học Đợt C).
         Số liệu máy tính: một ô — Doanh thu của tôi (biểu đồ tuần); Còn thiếu tiền / Chờ xác nhận / Chưa phụ trách nay là thẻ trong #dash-viec. Điện thoại dùng #dash-so (đủ bốn ô). -->
    <section id="dash-so-mt" class="dash-so-mt" aria-label="Số liệu"></section>
    <section id="dash-review" class="card dash-review" hidden>
      <div class="dash-review-head"><span class="dash-review-heading icon-label">Cần xem lại</span></div>
      <div id="dash-review-list"></div>
    </section>
    <section id="dash-today" class="card dash-today">
      <div class="dash-today-head">
        <span class="dash-today-title icon-label">Chuyến đón</span>
        <span id="dash-today-count" class="badge badge-confirmed" hidden></span>
        <a class="dash-today-all" href="/orders"><span class="lbl-full">Xem tất cả</span><span class="lbl-short">Tất cả</span></a>
      </div>
      <div id="dash-today-days" class="dash-days" role="group" aria-label="Chọn ngày đón" hidden></div>
      <!-- Dòng thời gian trong ngày (chỉ máy tính, bản vẽ v2): vạch giờ, "Bây giờ", chấm từng chuyến — trang trí, thông tin đã có trong từng dòng. -->
      <div id="dash-tl" class="dash-tl" aria-hidden="true" hidden></div>
      <div id="dash-today-list"></div>
      <p id="dash-today-empty" class="empty" hidden>Không có chuyến nào hôm nay.</p>
    </section>
    <!-- Thẻ "Lối tắt" (chỉ máy tính, bản vẽ 1.73): 7 ô + "Tất cả" mở hộp mọi chức năng. Điện thoại dùng lưới #dash-o. -->
    <section id="dash-loi-tat" class="card dash-loi-tat" hidden>
      <div class="dash-loi-tat-head"><h2 class="dash-loi-tat-heading">Lối tắt</h2></div>
      <nav id="dash-loi-tat-luoi" class="dash-loi-tat-luoi" aria-label="Lối tắt"></nav>
    </section>
  </div>
</main>
<script type="module" src="/js/home.js"></script>
</body></html>
