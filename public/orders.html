<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><title>Đơn hàng — Island Booking System</title></head>
<body>
<header id="topbar"></header>
<main>
  <h1>Đơn hàng</h1>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Tìm mã đơn, tên, SĐT…" autocomplete="off">
    <button id="loc-mo" class="btn loc-mo" type="button" aria-haspopup="dialog">Lọc <span id="loc-dem" class="badge loc-dem" hidden></span></button>
    <a id="new-order" class="btn btn-primary" href="/order-form" hidden>+ Tạo đơn</a>
  </div>
  <div id="loc-chip" class="loc-chip" hidden></div>
  <div id="error" class="alert" role="alert" hidden></div>
  <div id="loading" class="skeleton-list" aria-hidden="true"><div class="skeleton-row"></div><div class="skeleton-row"></div></div>
  <div id="list"></div>
  <p id="empty" class="empty" hidden>Chưa có đơn nào khớp.</p>
  <button id="more" class="btn" type="button" hidden>Tải thêm</button>
</main>
<script type="module" src="/js/orders.js"></script>
</body></html>
