<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/giao-dien.css"><title>Phí đưa đón — Island Booking System</title><script src="/js/giu-cho-dai.js"></script></head>
<body data-rong="vua" data-title="Phí đưa đón" data-back="/account">
<header id="topbar"></header>
<div id="strips"></div>
<main>
  <!-- Màn bảng phí đưa đón (kế hoạch Phí đưa đón, Đợt B Task 8): chỉ ô admin.manage. web/phi-don.ts dựng nội dung; chữ hiển thị ở src/shared/phi-don-hien-thi.ts. -->
  <h1>Phí đưa đón</h1>
  <p class="muted">Mức phí đưa đón theo khu vực đón.</p>
  <!-- ADR-0218 (Task 11): phí trên đơn do Nền tảng tính từ giá gốc Sheet. Màn này giữ «ngày bắt đầu áp», danh sách dịch vụ chưa có giá gốc và chương trình miễn phí; bảng mức theo khu vực + «Thử tra» (luật cũ) nằm trong khối gập cuối trang, dữ liệu để nguyên. -->
  <div id="error" class="alert" role="alert" hidden></div>
  <div id="pd-khung" hidden>
    <section id="pd-trang-thai" class="card card-col pd-khoi"></section>
    <section id="pd-chuong-trinh" class="card card-col pd-khoi"></section>
    <details id="pd-luat-cu" class="pd-khoi">
      <summary>Bảng mức theo khu vực và Thử tra — luật cũ, không dùng cho đơn</summary>
      <div class="alert warn" role="note" data-chu="adr-0218">Luật cũ, không dùng cho đơn: từ ADR-0218 phí trên đơn do Nền tảng tính từ giá gốc trên Sheet. Bảng này chỉ còn để tra lại, không ảnh hưởng đơn.</div>
      <section id="pd-thu-tra" class="card card-col pd-khoi"></section>
      <div id="pd-thieu-chung" class="alert warn" role="status" hidden></div>
      <div id="pd-canh-bao" class="alert warn" role="status" hidden></div>
      <section class="pd-khoi">
        <div class="toolbar"><button id="pd-them" class="btn btn-primary" type="button">＋ Thêm mức phí</button></div>
        <div id="pd-form"></div>
        <div id="pd-muc"></div>
      </section>
    </details>
  </div>
</main>
<script type="module" src="/js/phi-don.js"></script>
</body></html>
