<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/giao-dien.css"><title>Điều chỉnh công nợ — Island Booking System</title><script src="/js/giu-cho-dai.js"></script></head>
<body data-rong="hep" data-khuon="bieu-mau" data-khung-goc="bieu-mau" data-title="Điều chỉnh công nợ" data-back="/account">
<header id="topbar"></header>
<div id="strips"></div>
<main>
  <!-- Điều chỉnh công nợ cần người thứ hai duyệt (ADR-0115 đợt 1). Kế toán, Toàn quyền gửi yêu cầu (ô ledger.write); Kế toán, Toàn quyền, Quản trị duyệt (ô ledger.adjust.approve).
       web/dieu-chinh-cong-no.ts dựng nội dung. -->
  <h1>Điều chỉnh công nợ</h1>
  <div class="dau-trang"><p class="doan-dan"><span id="dc-giai-thich"></span> <a href="/phan-dinh">Mở màn Phân định trách nhiệm (đơn đã tới bước Khách đã trả đủ)</a></p></div>
  <div id="error" class="alert" role="alert" hidden></div>
  <div id="ok" class="alert ok" role="status" hidden></div>
  <!-- Ẩn cho tới khi trang biết người xem có ô gửi hoặc ô duyệt (khỏi hiện khung trống cho tài khoản không có quyền). -->
  <div id="dc-noi-dung" class="vung-ve" hidden>
    <section class="khoi" id="dc-khoi-duyet" aria-labelledby="dc-duyet-tieu-de" hidden>
      <header class="khoi-dau"><h2 id="dc-duyet-tieu-de">Chờ duyệt</h2></header>
      <div id="dc-duyet-ds"></div>
    </section>
    <form id="dc-khoi-gui" class="khoi" aria-labelledby="dc-gui-tieu-de" novalidate hidden>
      <header class="khoi-dau"><h2 id="dc-gui-tieu-de">Gửi yêu cầu mới</h2></header>
      <div id="dc-form" class="luoi">
        <div class="truong"><label for="dc-don-q">Đơn (gõ mã đơn rồi chọn)</label><input id="dc-don-q" class="o" type="search" autocomplete="off" placeholder="Ví dụ TD-2610-0001"><div id="dc-don-kq" class="thanh-nut" hidden></div></div>
        <div class="truong"><label for="dc-no-q">Bên nợ (gõ tên rồi chọn)</label><input id="dc-no-q" class="o" type="search" autocomplete="off"><div id="dc-no-kq" class="thanh-nut" hidden></div></div>
        <div class="truong"><label for="dc-duoc-q">Bên được nợ (gõ tên rồi chọn)</label><input id="dc-duoc-q" class="o" type="search" autocomplete="off"><div id="dc-duoc-kq" class="thanh-nut" hidden></div></div>
        <p id="dc-da-chon" class="khoi-mo-ta" aria-live="polite"></p>
        <div class="truong" data-cot="6"><label for="dc-loai">Loại dòng sổ</label><select id="dc-loai" class="o"></select></div>
        <div class="truong" data-cot="6"><label for="dc-so-tien">Số tiền (₫)</label><input id="dc-so-tien" class="o" type="text" inputmode="numeric" autocomplete="off"></div>
        <div class="truong"><label for="dc-ly-do">Lý do (tối thiểu 10 ký tự, không ghi số điện thoại)</label><textarea id="dc-ly-do" class="o" data-loai="nhieu-dong" rows="2" maxlength="300" autocomplete="off"></textarea></div>
      </div>
      <div class="thanh-nut"><button type="submit" id="dc-gui-btn" class="nut" data-cap="chinh">Gửi yêu cầu chờ duyệt</button></div>
    </form>
    <section class="khoi" id="dc-khoi-cua-toi" aria-labelledby="dc-cua-toi-tieu-de" hidden>
      <header class="khoi-dau"><h2 id="dc-cua-toi-tieu-de">Yêu cầu của tôi</h2></header>
      <div id="dc-cua-toi-ds"></div>
    </section>
  </div>
</main>
<script type="module" src="/js/dieu-chinh-cong-no.js"></script>
</body></html>
