<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0c4a6e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Tour Đảo"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><title>Nhân viên — Tour Đảo Booking</title></head>
<body data-title="Nhân viên">
<header id="topbar"></header>
<main>
  <h1>Quản lý nhân viên</h1>
  <div id="error" class="alert" role="alert" hidden></div>
  <section id="secret" class="card secret" hidden></section>
  <section id="sheet" class="card" hidden></section>
  <section id="edit" class="card" hidden></section>
  <section class="card">
    <h2>Thêm nhân viên</h2>
    <form id="add-form" class="grid three" autocomplete="off">
      <label>Họ tên<input id="add-name" type="text" maxlength="200" required></label>
      <label>Số điện thoại (tên đăng nhập)<input id="add-phone" type="tel" inputmode="tel" required></label>
      <div>
        <strong>Quyền trong app</strong>
        <label class="check"><input id="add-perm-SALES" type="checkbox" checked style="width:auto;display:inline;margin:0 6px 0 0">Bán hàng</label>
        <label class="check"><input id="add-perm-ACCOUNTING" type="checkbox" style="width:auto;display:inline;margin:0 6px 0 0">Kế toán</label>
        <label class="check"><input id="add-perm-ADMIN" type="checkbox" style="width:auto;display:inline;margin:0 6px 0 0">Quản trị</label>
        <label class="check"><input id="add-perm-FIELD" type="checkbox" style="width:auto;display:inline;margin:0 6px 0 0">Thực hiện</label>
      </div>
      <div><button class="btn btn-primary" type="submit">Tạo tài khoản</button></div>
    </form>
    <p class="muted">Hệ thống tự sinh PIN 6 số và chỉ hiện một lần. <button id="sheet-pull" class="btn btn-link" type="button">Đồng bộ danh sách từ Google Sheet…</button></p>
  </section>
  <section class="card table-wrap">
    <table class="items">
      <thead><tr><th>Họ tên</th><th>Số điện thoại</th><th>Quyền</th><th>Tạo lúc</th><th>Đăng nhập gần nhất</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </section>
  <div id="list-cards" class="card-list"></div>
</main>
<script type="module" src="/js/staff.js"></script>
</body></html>
