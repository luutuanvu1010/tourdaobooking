  <!-- Tạo / sửa chuyến (ADR-0049 V3; bản vẽ docs/design/van-chuyen-dieu-phoi/project/03 Tao sua chuyen.dc.html). /chuyen-sua?ngay=YYYY-MM-DD = tạo; ?id=<chuyến> = sửa.
       Khuôn Biểu mẫu của khung gốc (ADR-0222): đường quay lại chính xác (#cx-back, ở đầu trang), dải lỗi (#cx-banner), khối biểu mẫu #cx-form trên lưới 12 cột,
       thanh nút cuối trang #cx-nut (vùng nội dung từ 560: «Huỷ bỏ» cạnh «Lưu chuyến» bên phải), khối «<xe> trong ngày» #cx-ngay; điện thoại: hai nút dính
       đáy #cx-bottom. #cx-layout là vùng vẽ bọc hai khối (ẩn khi không có quyền xếp xe). Tên trang nằm ở thanh trên; h1 chỉ cho trình đọc màn hình. -->
  <div class="dau-trang"><a id="cx-back" href="/dieu-phoi">‹ Điều phối xe</a></div>

  <div id="error" class="alert" role="alert" hidden></div>

  <form id="cx-form" class="khoi" autocomplete="off" novalidate hidden></form>
