  <h1>Chụp bù mức</h1>
  <p class="muted">Đơn đã xác nhận trước khi có bảng mức nên chưa có bản chụp mức hoa hồng, người bán. Chụp bù lấy mức đang áp ở ngày xác nhận; còn thiếu mức thì Nền tảng không chụp và nêu dịch vụ cần cài mức.</p>
