<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/giao-dien.css"><title>Hoa hồng đối tác — Island Booking System</title></head>
<body data-title="Hoa hồng đối tác" data-back="/account">
<header id="topbar"></header>
<main>
  <!-- Hoa hồng đối tác (thiết kế lại, PR 2). Xem: partner.commission.view; thêm / ngừng mức: partner.commission.write. Tài khoản giữ quyền Đối tác không vào được (máy chủ 403).
       web/hoa-hong.ts nạp dữ liệu và chuyển hai thẻ; nội dung từng thẻ do các khối web/hoa-hong-*.ts vẽ vào #hh-the-ap-dung, #hh-the-thiet-lap. -->
  <div class="hh-dau">
    <h1>Hoa hồng đối tác</h1>
    <button type="button" id="hh-them-muc" class="btn btn-primary btn-chinh" hidden>＋ Thêm mức</button>
  </div>
  <div id="error" class="alert" role="alert" hidden></div>
  <div id="ok" class="alert ok" role="status" hidden></div>
  <!-- Ẩn cho tới khi máy chủ trả dữ liệu (khỏi hiện khung trống cho tài khoản không có quyền xem). -->
  <div id="hh-noi-dung" hidden>
    <div class="tx-tabs hh-the" role="tablist" aria-label="Hoa hồng đối tác">
      <button type="button" role="tab" id="hh-tab-ap-dung" class="tx-tab" aria-selected="true" aria-controls="hh-the-ap-dung" tabindex="0" data-the="ap-dung">Mức đang áp dụng</button>
      <button type="button" role="tab" id="hh-tab-thiet-lap" class="tx-tab" aria-selected="false" aria-controls="hh-the-thiet-lap" tabindex="-1" data-the="thiet-lap">Thiết lập</button>
    </div>
    <section id="hh-the-ap-dung" role="tabpanel" aria-labelledby="hh-tab-ap-dung"></section>
    <section id="hh-the-thiet-lap" role="tabpanel" aria-labelledby="hh-tab-thiet-lap" hidden></section>
  </div>
  <div id="hh-thanh-cuoi" class="vc-bottom-bar thanh-hanh-dong-cuoi" hidden></div>
</main>
<script type="module" src="/js/hoa-hong.js"></script>
</body></html>
