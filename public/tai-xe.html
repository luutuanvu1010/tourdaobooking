<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/giao-dien.css"><title>Trang chủ — Island Booking System</title><script src="/js/giu-cho-dai.js"></script></head>
<!-- Trang đầu của tài xế (ADR-0040 D3; bản vẽ docs/design/van-chuyen-1a/project/07 Trang dau tai xe.dc.html). Không khai data-title: điện thoại hiện logo như Trang chủ.
     Khuôn Tổng quan của khung gốc (ADR-0222): đầu trang (lời chào, ngày) rồi lưới khối — «Cuốc xe» (liên kết sang Cuốc của tôi) và «Giấy tờ của tôi». -->
<body data-rong="rong" data-khung-goc="tong-quan">
<header id="topbar"></header>
<div id="strips"></div>
<main>
  <h1 id="tx-hello"></h1>
  <div class="dau-trang"><p id="tx-date" class="doan-dan"></p></div>
  <div id="error" class="alert" role="alert" hidden></div>
  <div class="luoi">
    <!-- Khối "Cuốc xe" (quyết định thiết kế 9: vị trí chính): tai-xe.ts thay bằng liên kết "Xem cuốc của tôi" (mọi tài xế — A4 T6/T9); không có ô Cuốc thì ẩn. -->
    <section id="tx-cuoc" class="khoi" data-kieu="bang" data-cot="6" aria-labelledby="tx-cuoc-title">
      <header class="khoi-dau"><h2 id="tx-cuoc-title">Cuốc xe</h2></header>
      <div id="tx-cuoc-ds" class="ds-dong"><p class="rong">Đang mở cuốc xe…</p></div>
    </section>
    <section id="tx-docs" class="khoi" data-kieu="bang" data-cot="6" aria-labelledby="tx-docs-title">
      <header class="khoi-dau"><h2 id="tx-docs-title">Giấy tờ của tôi</h2></header>
      <div class="khoi-viec" data-cho="dau"><a id="tx-docs-all" class="nut" data-cap="loi" href="/account">Xem tất cả</a></div>
      <div id="tx-docs-list" class="ds-dong"></div>
    </section>
  </div>
</main>
<script type="module" src="/js/tai-xe.js"></script>
</body></html>
