<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/api/giao-dien.css"><title>Địa điểm — Island Booking System</title></head>
<body data-title="Địa điểm">
<header id="topbar"></header>
<main>
  <h1>Địa điểm</h1>
  <p class="muted">Nơi phát sinh nghiệp vụ: văn phòng, quầy vé, bến tàu, bến cảng. Địa điểm không xoá được — chỉ ngưng dùng.</p>
  <div id="error" class="alert" role="alert" hidden></div>
  <section id="edit" class="card" hidden></section>
  <section id="add-card" class="card" hidden>
    <h2>Thêm địa điểm</h2>
    <form id="add-form" class="grid three" autocomplete="off">
      <label>Mã (chữ HOA, số, gạch dưới)<input id="add-code" type="text" maxlength="40" placeholder="QUAY_VE_05" required></label>
      <label>Tên<input id="add-name" type="text" maxlength="100" required></label>
      <label>Loại<select id="add-type"></select></label>
      <label>Địa chỉ<input id="add-address" type="text" maxlength="300"></label>
      <label>Thứ tự<input id="add-sort" type="number" min="0" max="9999" value="0"></label>
      <div><button class="btn btn-primary" type="submit">Thêm</button></div>
    </form>
  </section>
  <section class="card table-wrap">
    <table class="items">
      <thead><tr><th>Mã</th><th>Tên</th><th>Loại</th><th>Địa chỉ</th><th>Thứ tự</th><th></th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </section>
  <div id="list-cards" class="card-list"></div>
</main>
<script type="module" src="/js/locations.js"></script>
</body></html>
