<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><title>Nhật ký — Island Booking System</title></head>
<body data-title="Nhật ký" data-back="/account">
<header id="topbar"></header>
<main>
  <h1>Nhật ký hệ thống</h1>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Tìm theo mã đơn, mã dịch vụ hoặc tên nhân viên…" autocomplete="off">
    <select id="action" aria-label="Lọc hành động">
      <option value="">Mọi hành động</option>
      <!-- các nhóm/hành động do web/audit.ts sinh từ src/shared/audit-actions.ts -->
    </select>
  </div>
  <div id="error" class="alert" role="alert" hidden></div>
  <div class="card table-wrap">
    <table class="items">
      <thead><tr><th>Thời gian</th><th>Người thao tác</th><th>Hành động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead>
      <tbody id="list"></tbody>
    </table>
  </div>
  <div id="list-cards" class="card-list"></div>
  <p id="empty" class="empty" hidden>Chưa có bản ghi nào khớp.</p>
  <button id="more" class="btn" type="button" hidden>Tải thêm</button>
</main>
<script type="module" src="/js/audit.js"></script>
</body></html>
