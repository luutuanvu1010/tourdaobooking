<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/giao-dien.css"><title>Điều phối xe — Island Booking System</title><script src="/js/giu-cho-dai.js"></script></head>
<body data-rong="rong" data-khung-goc="tong-quan" data-title="Điều phối xe" data-back="/account">
<header id="topbar"></header>
<div id="strips"></div>
<main>
  <!-- Điều phối xe (ADR-0049 V1; bản vẽ docs/design/van-chuyen-dieu-phoi/project/01 Dieu phoi xe.dc.html + dp-chua-xep, dp-dong-thoi-gian, dp-can-xu-ly). /dieu-phoi?ngay=YYYY-MM-DD.
       Khuôn Tổng quan của khung gốc (ADR-0222): đầu trang (bộ chọn ngày bên trái, «+ Chuyến mới» bên phải) → dải số (một khối) → lưới ba khối: Chưa xếp (3/12),
       Dòng thời gian theo xe (6/12, vùng tự do có tên trong sổ ngoại lệ) và Cần xử lý (3/12). Vùng nội dung hẹp hơn 560: ba khối thành ba thẻ (#dp-tabs), mỗi lúc hiện một. -->
  <h1 id="dp-title">Điều phối xe</h1>
  <div class="dau-trang">
    <div class="hang">
      <button id="dp-truoc" type="button" class="nut" data-cap="phu" aria-label="Ngày trước">‹</button>
      <input id="dp-ngay" class="o" type="date" aria-label="Ngày điều phối">
      <button id="dp-sau" type="button" class="nut" data-cap="phu" aria-label="Ngày sau">›</button>
      <span id="dp-ngay-nhan" class="o-phu"></span>
    </div>
    <a id="dp-moi" class="nut" data-cap="chinh" href="/chuyen-sua" hidden>+ Chuyến mới</a>
  </div>
  <div id="error" class="alert" role="alert" hidden></div>
  <div id="dp-banner" class="vung-ve"></div>
  <div id="dp-trang" class="vung-ve" hidden>
    <section id="dp-so-khoi" class="khoi" aria-label="Số liệu trong ngày"><dl id="dp-so" class="dai-so"></dl></section>
    <div id="dp-tx-ban" hidden></div>
    <div id="dp-tabs" class="tab-phu" data-kieu="gach" data-chi="hep" role="tablist" aria-label="Phần của bảng điều phối"></div>
    <div class="luoi">
      <section id="dp-cot-chua-xep" class="khoi" data-kieu="bang" data-cot="3" role="tabpanel" aria-labelledby="dp-tab-chua-xep"></section>
      <div id="dp-cot-xe" class="cot-khoi" data-cot="6" role="tabpanel" aria-labelledby="dp-tab-xe"></div>
      <section id="dp-cot-can-xu-ly" class="khoi" data-kieu="bang" data-cot="3" role="tabpanel" aria-labelledby="dp-tab-can-xu-ly"></section>
    </div>
  </div>
</main>
<script type="module" src="/js/dieu-phoi.js"></script>
</body></html>
