<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/giao-dien.css"><title>Lịch xe bận — Island Booking System</title><script src="/js/giu-cho-dai.js"></script></head>
<body data-rong="rong" data-khung-goc="danh-sach" data-title="Lịch xe bận" data-back="/account">
<header id="topbar"></header>
<div id="strips"></div>
<main>
  <!-- Lịch xe bận (ADR-0055 VK2-A): tuần theo xe; form "Thêm lịch bận" mở tại chỗ. Chỉ Quản trị + Toàn quyền (ô vehicle.manage — câu 3.4).
       Khuôn Danh sách của khung gốc (ADR-0222): thanh chuyển tuần với nút «Thêm lịch bận» ở mép phải, khối form (ẩn tới khi mở), rồi MỘT khối bảng: khối rộng
       từ 800 là bảng xe × bảy ngày (#xb-luoi), hẹp hơn là danh sách dòng theo xe, mỗi dòng liệt kê ngày bận (#xb-ds). -->
  <h1>Lịch xe bận</h1>
  <div id="xb-nav" class="thanh-loc" hidden>
    <button id="xb-truoc" type="button" class="nut" data-cap="phu" aria-label="Tuần trước">‹</button>
    <button id="xb-nay" type="button" class="nut" data-cap="phu">Tuần này</button>
    <button id="xb-sau" type="button" class="nut" data-cap="phu" aria-label="Tuần sau">›</button>
    <button id="xb-them" type="button" class="nut day-phai" data-cap="chinh" hidden>Thêm lịch bận</button>
  </div>
  <div id="error" class="alert" role="alert" hidden></div>
  <div id="xb-bao" hidden></div>
  <form id="xb-form" class="khoi" aria-label="Thêm lịch bận" novalidate hidden></form>
  <section id="xb-the" class="khoi" data-kieu="bang" aria-labelledby="xb-sub" hidden>
    <header class="khoi-dau"><h2 id="xb-sub"></h2></header>
    <p id="xb-chu-thich" class="khoi-mo-ta" hidden></p>
    <p id="xb-empty" class="rong" hidden><strong>Chưa có xe nào</strong><span>Thêm xe ở mục Xe để ghi lịch bận.</span></p>
    <table id="xb-bang" class="bang" aria-label="Lịch xe bận theo tuần"><thead><tr id="xb-dau"></tr></thead><tbody id="xb-luoi"></tbody></table>
    <div id="xb-ds" class="ds-dong" data-thay-bang></div>
  </section>
</main>
<script type="module" src="/js/lich-xe-ban.js"></script>
</body></html>
