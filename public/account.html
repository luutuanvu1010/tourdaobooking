<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#0c4a6e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><title>Tôi — Island Booking System</title></head>
<body data-title="Tôi">
<header id="topbar"></header>
<main>
  <h1>Tôi</h1>
  <div id="error" class="alert" role="alert" hidden></div>
  <div id="ok" class="alert ok" hidden>Đã đổi PIN. Các thiết bị khác đang đăng nhập bằng tài khoản này sẽ bị đăng xuất.</div>
  <div class="account-layout">
    <section id="me" class="card"></section>
    <!-- Việc của tôi (FIELD đang phụ trách — ADR-0014 điều 6/11): web/account.ts chỉ hiện cho tài khoản có quyền Thực hiện. -->
    <section id="myjobs" hidden></section>
    <section id="links" class="card list-card"></section>
    <!-- Chế độ bảo trì: web/account.ts chỉ hiện cho tài khoản được phép bật/tắt (GET /api/maintenance trả canToggle). -->
    <section id="maintenance" class="card" aria-labelledby="maintenance-heading" hidden></section>
    <!-- Dịch vụ nhập tay (ADR-0061): web/nhap-tay-cai-dat.ts chỉ hiện cho Toàn quyền (GET /api/cai-dat/nhap-tay trả doiDuoc — ô settings.ops). -->
    <section id="nhap-tay-cai-dat" class="card" aria-labelledby="nhap-tay-heading" hidden></section>
    <!-- Đăng nhập bằng Face ID (ADR-0016): web/account.ts chỉ hiện khi máy chủ bật (GET /api/auth/config → passkey). -->
    <section id="passkeys" class="card" aria-labelledby="passkeys-heading" hidden></section>
    <!-- Thông báo màn hình khoá (ADR-0036): web/account.ts chỉ hiện khi máy chủ có khoá công khai VAPID (GET /api/account/thong-bao/may → khoa). -->
    <section id="push" class="card" aria-labelledby="push-heading" hidden></section>
    <form id="pin-form" class="card" autocomplete="off">
      <h2>Đổi mã PIN</h2>
      <label>PIN hiện tại<input id="current" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
      <label style="margin-top:12px">PIN mới (6 số)<input id="new" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
      <label style="margin-top:12px">Nhập lại PIN mới<input id="confirm" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
      <p class="muted">Không dùng PIN dễ đoán như 123456 hoặc 111111.</p>
      <button class="btn btn-primary" type="submit">Đổi PIN</button>
    </form>
  </div>
</main>
<script type="module" src="/js/account.js"></script>
</body></html>
