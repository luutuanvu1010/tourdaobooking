<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/giao-dien.css"><title>Tôi — Island Booking System</title><script src="/js/giu-cho-dai.js"></script></head>
<body data-rong="vua" data-title="Tôi">
<header id="topbar"></header>
<div id="strips"></div>
<main>
  <h1>Tôi</h1>
  <div id="error" class="alert" role="alert" hidden></div>
  <div id="ok" class="alert ok" hidden>Đã đổi PIN. Các thiết bị khác đang đăng nhập bằng tài khoản này sẽ bị đăng xuất.</div>
  <div class="account-layout">
    <section id="me" class="card"></section>
    <!-- Việc của tôi (FIELD đang phụ trách — ADR-0014 điều 6/11): web/account.ts chỉ hiện cho tài khoản có quyền Thực hiện. -->
    <section id="myjobs" hidden></section>
    <!-- Hồ sơ của tôi (ADR-0124, lát H-3): web/ho-so-cua-toi.ts chỉ hiện cho tài khoản có hồ sơ và ô party.self.view (mọi tài khoản, kể cả Đối tác). -->
    <section id="ho-so-cua-toi" class="card" aria-labelledby="hs-heading" hidden></section>
    <!-- Trả sau của tôi (ADR-0173 Đ3 mục 3): web/tra-sau-cua-toi.ts chỉ hiện cho tài khoản Đối tác đang bật Trả sau hoặc còn nợ. -->
    <section id="tra-sau-cua-toi" class="card" aria-labelledby="ts-cua-toi-heading" hidden></section>
    <!-- Hồ sơ tổ chức (ADR-0213 Đ6, Đ7.4): web/to-chuc-cua-toi.ts chỉ hiện cho tài khoản Đối tác — tổ chức mình quản lý / là thành viên, lời mời vào tổ chức và ô nhập mã (B2 Task 17). -->
    <section id="to-chuc-cua-toi" class="card" aria-labelledby="tc-cua-toi-heading" hidden></section>
    <section id="links" class="card list-card"></section>
    <section id="thanh-duoi" class="card" aria-labelledby="thanh-duoi-heading" hidden></section>
    <!-- Chế độ bảo trì: web/account.ts chỉ hiện cho tài khoản được phép bật/tắt (GET /api/maintenance trả canToggle). -->
    <section id="maintenance" class="card" aria-labelledby="maintenance-heading" hidden></section>
    <!-- Nhóm «Cài đặt lập đơn» (ADR-0227, việc 7): gom các công tắc lập đơn của Toàn quyền; nhóm tự ẩn khi không thẻ con nào hiện (CSS `.nhom-cai-dat:not(:has(...))`). Thẻ con giữ nguyên id. -->
    <div id="cai-dat-lap-don" class="nhom-cai-dat" role="group" aria-labelledby="cai-dat-lap-don-heading">
    <h2 id="cai-dat-lap-don-heading">Cài đặt lập đơn</h2>
    <!-- Dịch vụ nhập tay (ADR-0061): web/nhap-tay-cai-dat.ts chỉ hiện cho Toàn quyền (GET /api/cai-dat/nhap-tay trả doiDuoc — ô settings.ops). -->
    <section id="nhap-tay-cai-dat" class="card" aria-labelledby="nhap-tay-heading" hidden></section>
    <!-- Ẩn thông tin khách khi đối tác đặt vé (ADR-0154 Đ2.1): web/an-khach-cai-dat.ts chỉ hiện cho Toàn quyền (GET /api/cai-dat/an-thong-tin-khach trả doiDuoc — ô settings.ops). -->
    <section id="an-khach-cai-dat" class="card" aria-labelledby="an-khach-heading" hidden></section>
    <!-- Đối tác không nhập danh sách hành khách (ADR-0228 Đ1): web/cong-tac-doi-tac-cai-dat.ts chỉ hiện cho Toàn quyền (GET /api/cai-dat/hanh-khach-doi-tac trả doiDuoc — ô settings.ops). -->
    <section id="hanh-khach-dt-cai-dat" class="card" aria-labelledby="hanh-khach-dt-heading" hidden></section>
    <!-- Đơn đối tác không cần đủ tên khách (ADR-0228 Đ2): web/cong-tac-doi-tac-cai-dat.ts chỉ hiện cho Toàn quyền (GET /api/cai-dat/mien-du-ten-doi-tac trả doiDuoc — ô settings.ops). -->
    <section id="mien-du-ten-cai-dat" class="card" aria-labelledby="mien-du-ten-heading" hidden></section>
    <!-- Bắt buộc giờ đón cho đơn đối tác (ADR-0193 mục 1): web/gio-don-cai-dat.ts chỉ hiện cho Toàn quyền (GET /api/cai-dat/bat-buoc-gio-don trả doiDuoc — ô settings.ops). -->
    <section id="gio-don-cai-dat" class="card" aria-labelledby="gio-don-heading" hidden></section>
    <!-- Đơn đối tác không cần giờ đón (ADR-0228 Đ3): web/cong-tac-doi-tac-cai-dat.ts chỉ hiện cho Toàn quyền (GET /api/cai-dat/khong-can-gio-don trả doiDuoc — ô settings.ops). -->
    <section id="khong-can-gio-cai-dat" class="card" aria-labelledby="khong-can-gio-heading" hidden></section>
    <!-- Hiện riêng phí đưa đón trên biên nhận khách lẻ (ADR-0218 Đ3.4): web/phi-don-bien-nhan-cai-dat.ts chỉ hiện cho Toàn quyền (GET /api/cai-dat/phi-don-bien-nhan trả doiDuoc — ô settings.ops). -->
    <section id="phi-don-bien-nhan-cai-dat" class="card" aria-labelledby="phi-don-bien-nhan-heading" hidden></section>
    <!-- Đối tác không nhập nơi đón (ADR-0221 Đ1): web/noi-don-cai-dat.ts chỉ hiện cho Toàn quyền (GET /api/cai-dat/noi-don-doi-tac trả doiDuoc — ô settings.ops). -->
    <section id="noi-don-cai-dat" class="card" aria-labelledby="noi-don-heading" hidden></section>
    <!-- Chặn đơn chưa có giờ đón khi sát ngày đón (ADR-0227 Đ1): web/chan-chua-gio-cai-dat.ts chỉ hiện cho Toàn quyền (GET /api/cai-dat/chan-chua-gio-sat-ngay trả doiDuoc — ô settings.ops). -->
    <section id="chan-chua-gio-cai-dat" class="card" aria-labelledby="chan-chua-gio-heading" hidden></section>
    </div>
    <!-- Bảo mật đăng nhập (bảo mật hai lớp — ADR-0074 điều 5): web/account.ts hiện sau khi GET /api/account/mfa về; mọi tài khoản có phiên. -->
    <section id="mfa" class="card" aria-labelledby="mfa-heading" hidden></section>
    <!-- Đăng nhập bằng Face ID (ADR-0016): web/account.ts chỉ hiện khi máy chủ bật (GET /api/auth/config → passkey). -->
    <section id="passkeys" class="card" aria-labelledby="passkeys-heading" hidden></section>
    <!-- Thông báo màn hình khoá (ADR-0036): web/account.ts chỉ hiện khi máy chủ có khoá công khai VAPID (GET /api/account/thong-bao/may → khoa). -->
    <section id="push" class="card" aria-labelledby="push-heading" hidden></section>
    <!-- Phiên đăng nhập của tôi (ADR-0075 điều 9): web/account.ts hiện sau khi GET /api/account/sessions về. -->
    <section id="my-sessions" class="card" aria-labelledby="my-sessions-heading" hidden></section>
    <form id="pin-form" class="card" autocomplete="off">
      <h2>Đổi mã PIN</h2>
      <label>PIN hiện tại<input id="current" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
      <label style="margin-top:12px">PIN mới (6 số)<input id="new" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
      <label style="margin-top:12px">Nhập lại PIN mới<input id="confirm" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
      <p class="muted">Không dùng PIN dễ đoán như 123456 hoặc 111111.</p>
      <button class="btn btn-primary" type="submit">Đổi PIN</button>
    </form>
  </div>
</main>
<script type="module" src="/js/account.js"></script>
</body></html>
