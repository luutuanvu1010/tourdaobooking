<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0c4a6e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><title>Đăng nhập — Island Booking System</title></head>
<body class="login-page">
<!-- Bản thiết kế "Đăng nhập v2" (Claude Design, 2026-09-24): một cột giữa nền trắng ở MỌI khổ (bỏ cột thương hiệu máy tính của Đợt C). Id giữ nguyên để web/login.ts và kịch bản Chrome dùng tiếp. -->
<main class="login">
  <div class="login-col">
    <header class="login-head">
      <img class="login-logo" src="/icons/icon-192.png" alt="Tour Đảo" width="64" height="64">
      <h1>Đăng nhập</h1>
      <p class="login-sub">Island Booking System dành cho nhân viên và đối tác.</p>
    </header>
    <!-- Banner chế độ bảo trì: web/login.ts hiện khi GET /api/auth/config báo đang bảo trì (hoặc đăng nhập bị 503 `maintenance`). KHÔNG che form: chủ dự án vẫn phải đăng nhập được. -->
    <div id="maintenance-banner" class="alert warn login-maintenance" role="status" hidden><p id="maintenance-text"></p></div>
    <div class="login-body">
      <!-- Đăng nhập bằng Face ID (ADR-0016): web/login.ts chỉ hiện khối này khi GET /api/auth/config báo passkey = true và trình duyệt hỗ trợ; lúc đó nút Face ID (chỉ biểu tượng, tên đọc được nằm ở aria-label — chủ dự án chốt 2026-09-24) là nút chính, nút PIN chuyển sang kiểu phụ. Khối KHÔNG có `hidden` riêng: public/app.css ẩn nó theo `hidden` của #passkey-login (`:has`). -->
      <div id="passkey-block" class="login-passkey">
        <button id="passkey-login" class="btn btn-primary login-passkey-btn" type="button" aria-label="Đăng nhập bằng Face ID hoặc vân tay" title="Đăng nhập bằng Face ID hoặc vân tay" hidden></button>
        <p id="passkey-hint" class="muted login-hint" role="status" hidden></p>
        <div class="login-or" aria-hidden="true"><span>hoặc</span></div>
      </div>
      <form id="login-form" class="login-form" autocomplete="on">
        <div id="error" class="alert" role="alert" hidden></div>
        <div class="login-fields">
          <div class="login-field">
            <label for="phone">Số điện thoại</label>
            <input id="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="09xx xxx xxx" required autofocus>
          </div>
          <div class="login-field login-field-pin">
            <div class="login-field-main">
              <label for="pin">Mã PIN 6 số</label>
              <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="current-password" placeholder="••••••" required>
            </div>
            <button id="pin-toggle" class="login-pin-toggle" type="button" aria-controls="pin" aria-pressed="false" aria-label="Hiện mã PIN">Hiện</button>
          </div>
        </div>
        <!-- Khung của widget Cloudflare Turnstile: web/login.ts chỉ hiện và dựng khi máy chủ báo có khoá (GET /api/auth/config). -->
        <div id="turnstile-widget" class="login-turnstile" hidden></div>
        <button id="turnstile-retry" class="btn login-btn" type="button" hidden>Thử lại</button>
        <button id="submit" class="btn btn-primary login-btn" type="submit">Đăng nhập bằng PIN</button>
      </form>
      <!-- Hotline do web/login.ts điền từ GET /api/company (lỗi/không có hotline thì chỉ còn câu đầu). -->
      <p id="forgot" class="login-forgot">Quên PIN? Báo quản trị viên để đặt lại<span id="forgot-call"></span>.</p>
    </div>
    <!-- Lời mời bật Face ID sau khi đăng nhập bằng PIN thành công (A-2: đặt NGOÀI form vì showInvite ẩn chính form login-form). -->
    <section id="passkey-invite" class="card login-invite" hidden></section>
  </div>
</main>
<!-- Chân trang: dòng phiên bản do web/login.ts điền từ src/shared/app-info.ts; khối công ty do web/login.ts dựng từ GET /api/company (lỗi/chậm thì ẩn). -->
<footer class="login-info">
  <p class="login-safety">Chỉ đăng nhập trên máy của bạn. Dùng máy chung thì đăng xuất khi xong việc.</p>
  <div id="company" class="login-company" hidden></div>
  <p id="release" class="login-release"></p>
</footer>
<script type="module" src="/js/login.js"></script>
</body></html>
