<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Island Booking"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"><title>Đăng nhập — Island Booking System</title></head>
<body class="login-page">
<!-- Màn Đăng nhập theo bản thiết kế "Đăng nhập.dc.html" (Claude Design, dự án 11c6f555…, chủ dự án yêu cầu tuân thủ 100% — 2026-09-24). Id giữ nguyên để web/login.ts và kịch bản Chrome dùng tiếp. Trang vừa một màn hình, không kéo được (public/app.css). -->
<main class="login">
  <div class="login-body">
    <div class="login-col">
      <img class="login-logo" src="/icons/icon-192.png" alt="" width="72" height="72">
      <h1>Tour Đảo Booking</h1>
      <!-- Banner chế độ bảo trì: web/login.ts hiện khi GET /api/auth/config báo đang bảo trì (hoặc đăng nhập bị 503 `maintenance`). KHÔNG che form: chủ dự án vẫn phải đăng nhập được. -->
      <div id="maintenance-banner" class="alert warn login-alert" role="status" hidden><p id="maintenance-text"></p></div>
      <div id="session-ended-banner" class="alert warn login-alert" role="status" hidden><p id="session-ended-text"></p></div>
      <div id="error" class="alert login-alert" role="alert" hidden></div>
      <form id="login-form" class="login-form" autocomplete="on">
        <div class="login-field">
          <label for="phone">Số điện thoại</label>
          <input id="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="09xx xxx xxx" enterkeyhint="next" required autofocus>
        </div>
        <div class="login-field">
          <div class="login-label-row"><label for="pin">Mã PIN 6 số</label><span id="pin-count" class="login-pin-count" aria-hidden="true">0/6</span></div>
          <div class="login-pin-wrap">
            <input id="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="current-password" placeholder="••••••" enterkeyhint="go" required>
            <button id="pin-toggle" class="login-pin-toggle" type="button" aria-controls="pin" aria-pressed="false" aria-label="Hiện mã PIN">Hiện</button>
          </div>
        </div>
        <!-- Khung của widget Cloudflare Turnstile (không có trong bản thiết kế — lớp bảo mật đang chạy thật, giữ): web/login.ts chỉ hiện và dựng khi máy chủ báo có khoá (GET /api/auth/config). -->
        <div id="turnstile-widget" class="login-turnstile" hidden></div>
        <button id="turnstile-retry" class="btn login-retry" type="button" hidden>Thử lại</button>
        <div class="login-actions">
          <button id="submit" class="btn btn-primary login-submit" type="submit"><span class="login-spinner" aria-hidden="true"></span><span id="submit-label">Đăng nhập</span></button>
          <!-- Nút sinh trắc học CHỈ có biểu tượng (ADR-0016): web/login.ts chỉ bỏ `hidden` khi GET /api/auth/config báo passkey = true và trình duyệt hỗ trợ. -->
          <button id="passkey-login" class="btn login-passkey-btn" type="button" aria-label="Đăng nhập bằng Face ID / vân tay" title="Đăng nhập bằng Face ID / vân tay" hidden></button>
        </div>
        <p id="passkey-hint" class="muted login-hint" role="status" hidden></p>
      </form>
      <!-- Lời mời bật Face ID sau khi đăng nhập bằng PIN thành công (A-2: đặt NGOÀI form vì showInvite ẩn chính form login-form). -->
      <section id="passkey-invite" class="card login-invite" hidden></section>
      <div id="support" class="login-support"><span>Hỗ trợ kỹ thuật</span><a href="tel:0989929373">0989 929 373</a></div>
      <!-- Dòng phiên bản do web/login.ts điền từ src/shared/app-info.ts (nhật ký thay đổi), theo định dạng của bản thiết kế. -->
      <span id="release" class="login-release"></span>
    </div>
  </div>
  <!-- Chân trang theo bản thiết kế. Tên + MST do web/login.ts thay từ GET /api/auth/config (hồ sơ công ty chủ — ADR-0024 6.2); chữ tĩnh là DỰ PHÒNG
       (chưa tải xong, lỗi mạng) và phải khớp dữ liệu gieo (src/chan-trang-dang-nhap.test.ts). Địa chỉ vẫn là chữ tĩnh (6.2 duyệt hai trường). -->
  <footer class="login-info">
    <span><span id="company-name" class="login-company-name">Công ty TNHH Tour Đảo</span> · MST <span id="company-tax">4201969169</span></span>
    <span class="login-address">19 Đường B2, Khu đô thị Vĩnh Điềm Trung, Phường Tây Nha Trang, Tỉnh Khánh Hoà</span>
  </footer>
</main>
<script type="module" src="/js/login.js"></script>
</body></html>
