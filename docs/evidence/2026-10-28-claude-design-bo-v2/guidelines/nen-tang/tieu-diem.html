<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Tiêu điểm bàn phím</title>
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:24px 28px;background:var(--c-nen)}
.l{display:flex;flex-wrap:wrap;gap:12px}
.sw{display:flex;flex-direction:column;gap:3px;width:120px;font-size:12px;line-height:16px;color:var(--c-chu-phu)}
.sw .c{height:56px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(15,23,42,.08);margin-bottom:4px}
.sw b{font-family:var(--f-so);font-weight:400;font-size:11.5px;color:var(--c-chu)}
.m{font-family:var(--f-so);font-size:12px;color:var(--c-chu-phu)}
.bt{display:inline-block;width:var(--s,20px);height:var(--s,20px);background:currentColor;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat;flex:none}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:20px}
td,th{padding:7px 10px 7px 0;border-bottom:1px solid var(--c-vien);text-align:left;vertical-align:middle}
th{font-size:12px;font-weight:500;color:var(--c-chu-phu)}

</style></head><body class="ib-goc">
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:6px"><button class="ib-nut ib-nut--chinh ib-xem-tieu-diem"><span class="ib-nut__chu">Lưu đơn</span></button><button class="ib-nut ib-nut--phu ib-xem-tieu-diem"><span class="ib-nut__chu">Xem chi tiết</span></button><span class="ib-chip ib-xem-tieu-diem">Tour đảo</span><div class="ib-o" style="width:220px"><input class="ib-o__dieu-khien ib-xem-tieu-diem" value="0912345678" aria-label="SĐT"></div></div><table style="margin-top:14px"><tr><th>Cặp</th><th>Tỉ lệ</th><th>Mức</th></tr><tr><td>#0f172a trên #ffffff</td><td class="m">17,9 : 1</td><td>AAA</td></tr><tr><td>#475569 trên #f2f5f9 (nút tắt)</td><td class="m">7,0 : 1</td><td>AA</td></tr><tr><td>#0891b2 vành trên #ffffff</td><td class="m">3,7 : 1</td><td>Đạt 3:1 phi văn bản</td></tr></table></body></html>
