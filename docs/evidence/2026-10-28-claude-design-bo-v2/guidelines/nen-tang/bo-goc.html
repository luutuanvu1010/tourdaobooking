<!-- @dsCard group="Khoảng cách & hình khối" viewport="700x180" name="Bo góc" subtitle="Bốn bậc — một bo cho mỗi loại vật" -->
<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Bo góc</title>
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;padding:24px 28px;background:var(--c-nen)}
.l{display:flex;flex-wrap:wrap;gap:12px}
.sw{display:flex;flex-direction:column;gap:3px;width:120px;font-size:12px;line-height:16px;color:var(--c-chu-phu)}
.sw .c{height:56px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(15,23,42,.08);margin-bottom:4px}
.sw b{font-family:var(--f-so);font-weight:400;font-size:11.5px;color:var(--c-chu)}
.m{font-family:var(--f-so);font-size:12px;color:var(--c-chu-phu)}
.bt{display:inline-block;width:var(--s,20px);height:var(--s,20px);background:currentColor;-webkit-mask:var(--u) center/contain no-repeat;mask:var(--u) center/contain no-repeat;flex:none}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:20px}
td,th{padding:7px 10px 7px 0;border-bottom:1px solid var(--c-vien);text-align:left;vertical-align:middle}
th{font-size:12px;font-weight:500;color:var(--c-chu-phu)}

</style></head><body class="ib-goc">
<div class="l" style="gap:20px"><div class="sw" style="width:140px"><div class="c" style="height:72px;background:var(--c-chinh-nhat);border-radius:8px"></div><b>--bo-8</b><span>Nút, ô, ô tích</span></div><div class="sw" style="width:140px"><div class="c" style="height:72px;background:var(--c-chinh-nhat);border-radius:12px"></div><b>--bo-12</b><span>Thẻ, dải, báo xong</span></div><div class="sw" style="width:140px"><div class="c" style="height:72px;background:var(--c-chinh-nhat);border-radius:18px"></div><b>--bo-18</b><span>Bảng trượt</span></div><div class="sw" style="width:140px"><div class="c" style="height:72px;background:var(--c-chinh-nhat);border-radius:999px"></div><b>--bo-999</b><span>Chip, tab, huy hiệu</span></div></div></body></html>
