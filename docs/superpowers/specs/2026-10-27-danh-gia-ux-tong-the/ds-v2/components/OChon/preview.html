<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Xem trước</title></head><body>
<div class="xem" data-huong="doc">
  <label class="xem-hang"><input class="o-tich" type="checkbox" checked> Gửi tin xác nhận cho khách</label>
  <div class="xem-hang" role="radiogroup" aria-label="Hình thức thu">
    <label class="xem-hang"><input class="o-chon-mot" type="radio" name="thu" checked> Tiền mặt</label>
    <label class="xem-hang"><input class="o-chon-mot" type="radio" name="thu"> Chuyển khoản</label>
  </div>
  <label class="xem-hang"><input class="cong-tac" type="checkbox" role="switch" checked> Bật nhắc giờ đón</label>
  <label class="xem-hang"><input class="cong-tac" type="checkbox" role="switch"> Tự xếp xe</label>
</div>
</body></html>
