<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Xem trước</title></head><body>
<div class="xem" data-huong="doc" style="gap:var(--s2)">
  <div class="dai" data-tong="bien" data-loai="bao-tri" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.2 4.4v3.9h3.9"/><path d="M12 8.2V12l2.8 1.8"/></svg><span class="dai-cau">Đang bảo trì, dự kiến xong 22:00</span><button class="nut" data-cap="phu" type="button">Xem</button></div>
  <div class="dai" data-tong="cat" data-loai="ngoai-mang" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12.5" r="8.5"/><path d="M12 7.5v5l3.5 2"/></svg><span class="dai-cau">Đang ngoài mạng — dữ liệu lần xem gần nhất</span><button class="nut" data-cap="phu" type="button">Thử lại</button></div>
  <div class="dai" data-tong="cat" data-loai="thong-bao" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12.5" r="8.5"/><path d="M12 7.5v5l3.5 2"/></svg><span class="dai-cau">Từ 01/11 bảng giá xe thuê mới có hiệu lực; đơn cũ giữ giá cũ.</span><button class="nut" data-cap="phu" type="button">Xem</button></div>
  <div class="dai" data-tong="do" data-loai="bao-mat" role="status"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16v.01"/></svg><span class="dai-cau">Bật bảo mật hai lớp để bảo vệ tài khoản.</span><button class="nut" data-cap="phu" type="button">Bật ngay</button><button class="dai-dong" type="button" aria-label="Đóng"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <p class="xem-ghi">Mỗi lúc chỉ một dải, ưu tiên trên → dưới: bảo trì › ngoài mạng › thông báo › bảo mật.</p>
</div>
</body></html>
