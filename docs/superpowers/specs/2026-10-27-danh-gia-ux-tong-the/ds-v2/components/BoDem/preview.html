<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Xem trước</title></head><body>
<div class="xem">
  <div class="xem-nhom"><span class="nhan-o">Người lớn</span><span class="chu-thich-o">1.350.000 · từ 12 tuổi</span>
    <div class="bo-dem"><button type="button" aria-label="Bớt một người lớn">−</button><output>2</output><button type="button" aria-label="Thêm một người lớn">+</button></div></div>
  <div class="xem-nhom"><span class="nhan-o">Em bé</span><span class="chu-thich-o">Miễn phí · dưới 1 m</span>
    <div class="bo-dem"><button type="button" aria-label="Bớt một em bé" disabled>−</button><output>0</output><button type="button" aria-label="Thêm một em bé">+</button></div></div>
  <div class="xem-nhom"><span class="nhan-o">Số khách</span><span class="chu-thich-o">7 khách = 2 lượt</span>
    <div class="bo-dem" data-loi="true"><button type="button" aria-label="Bớt một khách">−</button><output>51</output><button type="button" aria-label="Thêm một khách" disabled>+</button></div><span class="loi-o"><svg class="bt" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg> Tối đa 50 khách.</span></div>
</div>
</body></html>
