<!-- @dsCard group="Lớp phủ và khung" height=500 width=900 -->
<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Xem trước</title></head><body>
<div class="xem" style="align-items:stretch">
  <div class="khung-xem" style="width:390px;height:460px">
    <div style="padding:var(--s4);color:var(--c-text-muted)">Trang phía sau (390)</div>
    <div class="lop-phu"><div class="bang-truot" role="dialog" aria-modal="true" aria-labelledby="bt1">
      <div class="tay-keo" aria-hidden="true"></div>
      <div class="bang-truot-dau"><h2 id="bt1">Sửa thông tin chuyến</h2><button class="nut-bieu-tuong" type="button" aria-label="Đóng"><svg class="bt" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="bang-truot-than">
        <div class="truong"><label for="s1">Giờ khởi hành</label><input id="s1" class="o-nhap" type="time" value="07:00"></div>
        <div class="truong"><label for="s2">Có mặt tại</label><input id="s2" class="o-nhap" type="text" value="Bến tàu Hòn Tằm"></div>
        <div class="truong"><label for="s3">Ghi chú <span class="tuy-chon">(tuỳ chọn)</span></label><textarea id="s3" class="o-nhap" rows="2"></textarea></div>
      </div>
      <div class="bang-truot-chan"><button class="nut" data-cap="phu" type="button">Quay lại</button><button class="nut" data-cap="chinh" type="button">Lưu chuyến</button></div>
    </div></div>
  </div>
  <div class="khung-xem" style="flex:1;min-width:440px;height:460px">
    <div style="padding:var(--s4);color:var(--c-text-muted)">Trang phía sau (máy tính)</div>
    <div class="lop-phu" data-kieu="hop-thoai"><div class="bang-truot" role="dialog" aria-modal="true" aria-labelledby="bt2">
      <div class="bang-truot-dau"><h2 id="bt2">Lọc đơn hàng</h2><button class="nut-bieu-tuong" type="button" aria-label="Đóng"><svg class="bt" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="bang-truot-than">
        <div class="thong-bao dai-loi-dau" data-tong="loi" role="alert"><svg class="bt" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg><span class="than">Không lưu được bộ lọc. Kiểm tra mạng rồi bấm «Áp dụng» lại; điều kiện bạn chọn vẫn còn.</span></div>
        <div class="hang-truong"><div class="truong"><label for="f1">Trạng thái</label><select id="f1" class="o-nhap"><option>Chờ xác nhận</option></select></div><div class="truong"><label for="f2">Tháng</label><input id="f2" class="o-nhap" type="month" value="2026-10"></div></div>
      </div>
      <div class="bang-truot-chan"><button class="nut" data-cap="phu" type="button">Xoá lọc</button><button class="nut" data-cap="chinh" type="button">Áp dụng</button></div>
    </div></div>
  </div>
</div>
</body></html>
