<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Xem trước</title></head><body>
<div class="xem" data-huong="doc" style="max-width:420px">
  <div class="xem-nhom"><span class="xem-nhan">Hàng nhóm cuộn ngang, mép phải mờ</span>
    <div class="hang-chip" data-mo-mep="true" role="group" aria-label="Nhóm dịch vụ">
      <button class="chip" type="button" aria-pressed="true">Tất cả</button><button class="chip" type="button" aria-pressed="false">Tour</button><button class="chip" type="button" aria-pressed="false">Vé Hòn Tằm</button><button class="chip" type="button" aria-pressed="false">Thể thao biển</button><button class="chip" type="button" aria-pressed="false">Tháp Bà</button><button class="chip" type="button" aria-pressed="false">Đưa đón</button>
    </div></div>
  <div class="xem-nhom"><span class="xem-nhan">Chip đang lọc</span>
    <div class="dang-loc">
      <button class="chip" type="button" data-chon="true" aria-label="Bỏ lọc Chờ xác nhận">Chờ xác nhận <span class="xoa"><svg class="bt" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button>
      <button class="chip" type="button" data-chon="true" aria-label="Bỏ lọc tháng 10">Tháng 10 <span class="xoa"><svg class="bt" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button>
      <button class="chip" type="button">Xoá lọc</button>
      <button class="chip" type="button" disabled>Đã giao (tắt)</button>
    </div></div>
</div>
</body></html>
