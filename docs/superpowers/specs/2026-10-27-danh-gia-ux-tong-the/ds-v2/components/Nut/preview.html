<!-- @dsCard group="Hành động" height=230 -->
<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Xem trước</title></head><body>
<div class="xem" data-huong="doc">
  <div class="xem-hang">
    <button class="nut" data-cap="chinh" type="button">Lưu chuyến</button>
    <button class="nut" data-cap="phu" type="button">Quay lại</button>
    <button class="nut" data-cap="loi" type="button">Xem chi tiết</button>
    <button class="nut" type="button">Mặc định (không cấp)</button>
  </div>
  <div class="xem-hang">
    <button class="nut" data-cap="chinh" data-tong="san-ho" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>Xác nhận đơn</button>
    <button class="nut" data-cap="chinh" data-tong="nguy-hiem" type="button">Huỷ đơn</button>
    <button class="nut" data-cap="chinh" data-co="lon" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Tạo đơn</button>
  </div>
  <div class="xem-hang">
    <button class="nut" data-cap="chinh" type="button" disabled data-ly-do="Chọn lý do để huỷ">Huỷ đơn</button>
    <button class="nut" data-cap="chinh" type="button" data-ban="true" aria-busy="true">Đang lưu…</button>
    <p class="xem-ghi">Tắt: <code>disabled</code> + <code>data-ly-do</code>; đang gửi: <code>data-ban="true"</code>.</p>
  </div>
</div>
</body></html>
