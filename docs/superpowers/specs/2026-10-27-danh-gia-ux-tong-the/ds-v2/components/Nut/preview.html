<!-- @dsCard group="Hành động" height=300 -->
<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Xem trước</title></head><body>
<div class="xem" data-huong="doc">
  <div class="xem-nhom"><span class="xem-nhan">Ba cấp</span>
    <div class="xem" style="padding:0">
      <button class="nut" data-cap="chinh" type="button">Lưu, chờ xác nhận</button>
      <button class="nut" data-cap="phu" type="button">Quay lại</button>
      <button class="nut" data-cap="loi-nho" type="button">Xem tất cả</button>
    </div></div>
  <div class="xem-nhom"><span class="xem-nhan">Tông riêng và biểu tượng</span>
    <div class="xem" style="padding:0">
      <button class="nut" data-cap="chinh" data-tong="chot" type="button">Xác nhận đơn để gửi khách</button>
      <button class="nut" data-cap="phu" type="button"><svg class="bt" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Chiều về</button>
      <button class="nut" data-cap="phu" data-tong="nguy-hiem" type="button">Huỷ đơn</button>
      <button class="nut" data-cap="chinh" data-tong="nguy-hiem" type="button"><svg class="bt" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/></svg> Xoá vĩnh viễn</button>
    </div></div>
  <div class="xem-nhom"><span class="xem-nhan">Tắt có lý do · đang gửi · cỡ lớn</span>
    <div class="xem" style="padding:0;align-items:flex-start">
      <div><button class="nut" data-cap="chinh" type="button" disabled>Lưu lý do</button><span class="nut-ly-do">Chọn một lý do để lưu.</span></div>
      <button class="nut" data-cap="chinh" type="button" data-dang-tai="true">Đang gửi</button>
      <button class="nut" data-cap="chinh" data-co="lon" type="button">Đăng nhập</button>
      <button class="nut-bieu-tuong" type="button" aria-label="Đóng" style="color:var(--c-on-bar)"><svg class="bt" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div></div>
</div>
</body></html>
