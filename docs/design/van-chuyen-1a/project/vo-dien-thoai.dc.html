<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;border:1px solid var(--c-border);box-shadow:var(--shadow-overlay);background:var(--c-surface-alt);display:flex;flex-direction:column;font-family:var(--font);color:var(--c-text);font-size:var(--fs-ui);">
  <div style="flex:none;height:47px;box-sizing:border-box;padding:0 32px 8px;background:var(--c-primary);color:var(--c-on-dark);display:flex;align-items:flex-end;font-size:15px;font-weight:700;">9:41</div>
  <div style="flex:none;height:var(--bar-h);background:var(--c-primary);color:var(--c-on-dark);display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4) 0 var(--s2);">
    <sc-if value="{{ back }}" hint-placeholder-val="{{ true }}">
      <a href="{{ backHref }}" aria-label="Quay lại" style="flex:none;width:var(--tap-min);height:var(--tap-min);display:flex;align-items:center;justify-content:center;color:var(--c-on-dark);font-size:34px;line-height:1;text-decoration:none;border-radius:var(--radius-sm);">‹</a>
    </sc-if>
    <sc-if value="{{ brand }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:var(--s3);padding-left:var(--s2);">
        <img src="docs/design/a2-mockup/refs/logo-tour-dao-96.png" alt="" width="30" height="30" style="width:var(--logo-bar);height:var(--logo-bar);border-radius:var(--radius-pill);">
        <span style="font-family:var(--font-display);font-size:var(--fs-title);"><strong style="font-weight:800;">Island Booking</strong> <span style="font-weight:500;">System</span></span>
      </div>
    </sc-if>
    <div style="flex:1;min-width:0;font-family:var(--font-display);font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ title }}</div>
    <div style="flex:none;width:36px;height:36px;border-radius:var(--radius-pill);background:var(--c-sand);color:var(--c-sand-text);display:flex;align-items:center;justify-content:center;font-size:var(--fs-badge);font-weight:800;">{{ initials }}</div>
  </div>
  <div style="flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;">{{ children }}</div>
  <div style="flex:none;background:var(--c-surface);border-top:1px solid var(--c-border);padding-bottom:34px;">
    <div style="height:var(--tabbar-h);display:grid;grid-template-columns:{{ cols }};">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:{{ t.color }};font-size:var(--fs-tab);font-weight:{{ t.weight }};">
          <sc-if value="{{ t.isCreate }}" hint-placeholder-val="{{ false }}">
            <span style="width:36px;height:36px;border-radius:var(--radius-pill);background:var(--c-accent);color:var(--c-on-dark);display:flex;align-items:center;justify-content:center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
          </sc-if>
          <sc-if value="{{ t.normal }}" hint-placeholder-val="{{ true }}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ t.d }}"></path></svg>
          </sc-if>
          <span>{{ t.label }}</span>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Xe&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;driver&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tab&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tôi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;back&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;brand&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;backHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;QT&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;}}">
const IC = {
  home: 'M3 11l9-7 9 7M5 10v10h14V10',
  doc: 'M7 3h8l4 4v14H7zM10 11h6M10 15h6',
  tag: 'M3 12V4h8l10 10-8 8zM7.5 7.5h.01',
  users: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21v-1a6 6 0 0 1 12 0v1M16 3.5a4 4 0 0 1 0 7.5M22 21v-1a6 6 0 0 0-4-5.6',
  user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
};
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'admin';
    const active = this.props.tab ?? 'Tôi';
    const list = role === 'driver'
      ? [['Trang chủ', IC.home], ['Tôi', IC.user]]
      : [['Trang chủ', IC.home], ['Đơn hàng', IC.doc], ['Tạo đơn', null], ['Dịch vụ', IC.tag], ['Tài khoản', IC.users], ['Tôi', IC.user]];
    return {
      back: this.props.back ?? !this.props.brand,
      brand: !!this.props.brand,
      backHref: this.props.backHref ?? '#',
      title: this.props.title ?? '',
      initials: this.props.initials ?? 'QT',
      cols: `repeat(${list.length},1fr)`,
      tabs: list.map(([label, d]) => ({
        label, d, isCreate: !d, normal: !!d,
        color: label === active ? 'var(--c-primary)' : 'var(--c-text-muted)',
        weight: label === active ? 800 : 600,
      })),
    };
  }
}
</script>
</body>
</html>
