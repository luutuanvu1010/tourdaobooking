<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/tour-o-booking-design-system-34f284df-c97a-4672-bb66-d7df03a0d97a/styles.css">
<script src="_ds/tour-o-booking-design-system-34f284df-c97a-4672-bb66-d7df03a0d97a/_ds_bundle.js"></script>
</helmet>
<div style="position:relative;width:1040px;height:{{ height }};border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--c-border);box-shadow:var(--shadow-overlay);display:grid;grid-template-columns:var(--w-sidebar) minmax(0,1fr);font-family:var(--font);color:var(--c-text);font-size:var(--fs-ui);background:var(--c-surface-alt);">
  <x-import component-from-global-scope="TourOBookingDesignSystem_34f284.Sidebar" groups="{{ groups }}" active="{{ active }}" user="{{ user }}" logo-src="assets/logo-96.png" hint-size="236px,100%"></x-import>
  <div style="display:flex;flex-direction:column;min-width:0;min-height:0;">
    <x-import component-from-global-scope="TourOBookingDesignSystem_34f284.Topbar" title="{{ crumb }}" search="{{ showTools }}" on-new="{{ onNew }}" hint-size="100%,60px"></x-import>
    <div style="flex:1;min-height:0;overflow:auto;">
      <div style="max-width:var(--w-main);padding:{{ pad }};box-sizing:border-box;display:flex;flex-direction:column;gap:var(--s4);">{{ children }}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1040,&quot;height&quot;:820},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;owner&quot;,&quot;sales&quot;,&quot;accountant&quot;,&quot;driver&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;dieuphoi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vận chuyển › Điều phối xe&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;820px&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pad&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;var(--s5)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dpCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;tsType&quot;:&quot;number&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;}}">
const TRUCK = 'M3 16V6h11v10M14 9h4l3 4v3h-2M3 16h1M10 16h5M7 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4z';
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'admin';
    const h = React.createElement;
    const sub = (t) => h('span', { style: { paddingLeft: 30, display: 'block' } }, t);
    const truck = h('span', { style: { display: 'flex', alignItems: 'center', gap: 'var(--s3)', fontWeight: 700, color: 'var(--c-on-dark)' } },
      h('svg', { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true }, h('path', { d: TRUCK })), 'Vận chuyển');
    const vc = [
      { id: 'vc', label: truck },
      { id: 'dieuphoi', label: sub('Điều phối xe'), badge: this.props.dpCount ?? 8, badgeTone: 'sand' },
      { id: 'xe', label: sub('Xe') },
      { id: 'han', label: sub('Sắp hết hạn'), badge: 5, badgeTone: 'sand' },
      { id: 'lgx', label: sub('Loại giấy tờ xe') },
    ];
    if (role === 'owner') vc.push({ id: 'chinhsach', label: sub('Chính sách điều phối') });
    if (role !== 'accountant' && role !== 'sales') vc.push({ id: 'lydo', label: sub('Lý do điều phối') });
    const groups = role === 'driver'
      ? [{ title: 'CỦA TÔI', items: [{ id: 'home', label: 'Trang chủ', icon: 'home' }, { id: 'cuoc', label: 'Cuốc của tôi', icon: 'clock' }, { id: 'toi', label: 'Của tôi', icon: 'me' }] }]
      : [
          { title: 'BÁN HÀNG', items: [{ id: 'home', label: 'Trang chủ', icon: 'home' }, { id: 'don', label: 'Đơn hàng', icon: 'orders' }, { id: 'tao', label: 'Tạo đơn', icon: 'plus' }, { id: 'danhba', label: 'Danh bạ', icon: 'contact-card' }] },
          { title: 'QUẢN TRỊ', items: (role === 'sales' || role === 'accountant') ? vc.slice(0, 2) : [{ id: 'dv', label: 'Dịch vụ & giá', icon: 'services' }, { id: 'tk', label: 'Quản lý tài khoản', icon: 'staff' }, { id: 'dd', label: 'Địa điểm', icon: 'pin' }, { id: 'lgn', label: 'Loại giấy tờ người', icon: 'doc-check' }, ...vc, { id: 'nk', label: 'Nhật ký', icon: 'history' }] },
          { title: 'TÔI', items: [{ id: 'toi', label: 'Của tôi', icon: 'me' }, { id: 'gy', label: 'Góp ý / Báo lỗi', icon: 'chat' }, { id: 'tg', label: 'Trợ giúp', icon: 'help' }] },
        ];
    const ROLE = { admin: 'Quản trị', owner: 'Toàn quyền', sales: 'Bán hàng', accountant: 'Kế toán', driver: 'Tài xế' };
    const NAME = { admin: 'Phạm Thu Hoa', owner: 'Lưu Tuấn Vũ', sales: 'Lê Thị Trang', accountant: 'Đỗ Minh Châu', driver: 'Nguyễn Văn An' };
    return {
      height: this.props.height ?? '820px',
      pad: this.props.pad ?? 'var(--s5)',
      groups, active: this.props.active ?? 'dieuphoi',
      user: { name: this.props.userName ?? NAME[role], role: ROLE[role], onLogout: () => {} },
      crumb: this.props.crumb ?? 'Vận chuyển › Điều phối xe',
      showTools: role !== 'driver',
      onNew: role === 'driver' || role === 'accountant' ? undefined : () => {},
    };
  }
}
</script>
</body>
</html>
