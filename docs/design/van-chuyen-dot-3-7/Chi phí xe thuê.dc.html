===== MÀN 1a "Bảng giá thuê xe" (Topbar "Quản trị › Bảng giá thuê xe"; sidebar active "rate")

  - Hai ô: "Nhà xe" ▾, "Giá đang áp ngày" (02/10/2026).
  - Note: "Có cả giá theo tuyến và giá theo cỡ xe thì giá theo tuyến được dùng."
  - Ba tab viên thuốc 44px: "Giá thuê", "Tuyến", "Cỡ xe" (đang chọn nền --c-primary chữ trắng; còn lại primary-soft).
  - Máy tính: bảng cột minmax(0,1.5fr) | minmax(0,.8fr) | 110px | 150px | 96px | 140px: "TUYẾN"(+ghi chú 13px dưới), "CỠ XE", "SỐ TIỀN / CHUYẾN"(phải, 800 15px accent-strong), "HIỆU LỰC" ("01/07/2026 – đang áp"), "TRẠNG THÁI"(chip), nút link "Đổi giá" "Kết thúc" (ẩn khi Đã kết thúc). Tuyến trống hiện "Mọi tuyến", cỡ trống "Mọi cỡ xe" màu muted.

  - Tab Tuyến/Cỡ xe: lưới thẻ (minmax 300px): tiêu đề + gợi ý; mỗi dòng tên + chip Đang dùng/Ngưng dùng + link "Đổi tên" + link "Ngưng dùng"/"Dùng lại"; chân nền soft-hover ô thêm + nút primary "Thêm".

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const vnd = n => String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ' ₫';
    const T = {
      ok: ['var(--c-green-soft)', 'var(--c-green-text)'], soon: ['var(--c-primary-soft)', 'var(--c-primary)'],
      end: ['#E6EDF3', 'var(--c-text-muted)'], warn: ['var(--c-sand-soft)', 'var(--c-sand-text)'],
      bad: ['var(--c-danger-soft)', 'var(--c-danger-text)'], run: ['var(--c-primary)', '#fff'], gray: ['#E6EDF3', 'var(--c-text-muted)']
    };
    const side = { logo: 'assets/logo-96.png', user: { name: 'Lan Anh', role: 'Kế toán' },
      groups: [
        { title: 'Bán hàng', items: [{ id: 'home', label: 'Trang chủ', icon: 'home' }, { id: 'orders', label: 'Đơn hàng', icon: 'orders' }] },
        { title: 'Quản trị', items: [{ id: 'trips', label: 'Chuyến xe', icon: 'assign' }, { id: 'rate', label: 'Bảng giá thuê xe', icon: 'money' }, { id: 'stmt', label: 'Bảng kê chi phí xe', icon: 'doc-check' }] }
      ] };
    const fld = (label, value, o = {}) => ({
      label: label + (o.req ? ' *' : ''), value, mark: o.sel ? '▾' : '', vc: o.empty ? 'var(--c-placeholder)' : 'var(--c-text)',
      st: 'flex:1 1 ' + (o.basis || '150px') + ';display:flex;flex-direction:column;gap:4px;min-width:0',
      box: 'min-height:' + (o.area ? '72px' : '44px') + ';box-sizing:border-box;border:1px solid ' + (o.err ? 'var(--c-danger)' : 'var(--c-border)') + ';border-radius:8px;padding:' + (o.area ? '10px' : '0') + ' 12px;display:flex;align-items:' + (o.area ? 'flex-start' : 'center') + ';justify-content:space-between;font:16px Nunito;background:#fff'
    });
    const tabs = a => ['Giá thuê', 'Tuyến', 'Cỡ xe'].map((l, i) => ({ label: l, bg: i === a ? 'var(--c-primary)' : 'var(--c-primary-soft)', fg: i === a ? '#fff' : 'var(--c-primary)' }));

    // ---- 1a
    const mk = (route, size, amt, f, t, note, st, tone) => ({ route: route || 'Mọi tuyến', rc: route ? 'var(--c-text)' : 'var(--c-text-muted)', size: size || 'Mọi cỡ xe', sc: size ? 'var(--c-text)' : 'var(--c-text-muted)', amount: vnd(amt), range: f + ' – ' + (t || 'đang áp'), note, status: st, bg: T[tone][0], fg: T[tone][1], open: st !== 'Đã kết thúc' });
    const rows = [
      mk('Nha Trang – sân bay Cam Ranh', '10–16 khách', 450000, '01/07/2026', '', 'Giá một chiều', 'Đang áp', 'ok'),
      mk('Nha Trang – sân bay Cam Ranh', '10–16 khách', 400000, '01/01/2026', '30/06/2026', 'Giá cũ', 'Đã kết thúc', 'end'),
      mk('', '29–35 khách', 1100000, '01/07/2026', '', 'Giá theo cỡ xe, chạy mọi tuyến', 'Đang áp', 'ok'),
      mk('Nha Trang – Bình Ba', '', 1600000, '01/11/2026', '', 'Mùa cao điểm', 'Sắp áp', 'soon'),
      mk('Nha Trang – Vinpearl', '4–7 khách', 350000, '01/07/2026', '', '', 'Đang áp', 'ok')
    ];
    const dupForm = { title: 'Đổi giá — Nha Trang – sân bay Cam Ranh', hint: 'Dòng cũ sẽ kết thúc ngày 30/09/2026, dòng mới bắt đầu ngày 01/10/2026. Cần ít nhất một trong tuyến hoặc cỡ xe.', cta: 'Lưu giá mới', error: 'Nhà xe đã có giá cùng tuyến, cùng cỡ trong khoảng ngày này',
      fields: [fld('Tuyến', 'Nha Trang – sân bay Cam Ranh', { sel: 1, basis: '220px' }), fld('Cỡ xe', '10–16 khách', { sel: 1 }), fld('Số tiền (₫)', '480.000', { req: 1 }), fld('Từ ngày', '01/10/2026', { req: 1 }), fld('Đến ngày', 'Để trống nếu đang áp', { empty: 1 }), fld('Ghi chú', 'Tăng giá nhiên liệu', { basis: '220px' })] };
    const stopForm = { title: 'Thêm giá', hint: 'Cần ít nhất một trong tuyến hoặc cỡ xe.', cta: 'Lưu giá', error: 'Nhà xe này đã thôi hợp tác — không thể thêm giá mới',
      fields: [fld('Tuyến', 'Chọn tuyến (có thể trống)', { sel: 1, empty: 1, basis: '100%' }), fld('Cỡ xe', '29–35 khách', { sel: 1, basis: '100%' }), fld('Số tiền (₫)', '1.100.000', { req: 1, basis: '100%' }), fld('Từ ngày', '01/10/2026', { req: 1 }), fld('Đến ngày', 'Tuỳ chọn', { empty: 1 }), fld('Ghi chú', '', { basis: '100%' })] };
    const cats = (sizeOnly) => {
      const route = { title: 'Tuyến', hint: 'Thêm, đổi tên hoặc ngưng dùng. Tuyến ngưng dùng vẫn giữ trong giá cũ.', add: [fld('Tên tuyến mới', 'Ví dụ: Nha Trang – Đầm Môn', { empty: 1, basis: '160px' })],
        items: [['Nha Trang – sân bay Cam Ranh', 1], ['Nha Trang – Bình Ba', 1], ['Nha Trang – Vinpearl', 1], ['Nha Trang – Hòn Tằm', 0]].map(([name, on]) => ({ name, status: on ? 'Đang dùng' : 'Ngưng dùng', toggle: on ? 'Ngưng dùng' : 'Dùng lại' })) };
      const size = { title: 'Cỡ xe', hint: 'Nhập khoảng số khách, không kể tài xế.', add: [fld('Từ (khách)', '17', { basis: '70px' }), fld('Đến (khách)', '28', { basis: '70px' })],
        items: [['4–7 khách', 1], ['10–16 khách', 1], ['17–28 khách', 1], ['29–35 khách', 1], ['45 khách', 0]].map(([name, on]) => ({ name, status: on ? 'Đang dùng' : 'Ngưng dùng', toggle: on ? 'Ngưng dùng' : 'Dùng lại' })) };
      return sizeOnly ? [size] : [route, size];
    };
    // priceBoards: Máy tính 1040 · Danh sách giá | Đổi giá, báo trùng ngày (form thẻ nội tuyến) | Mục phụ Tuyến và Cỡ xe;
    //              Điện thoại 390 · Danh sách giá | Trạng thái trống (Nhà xe Minh Tâm) | Thêm giá, nhà xe đã thôi hợp tác (tấm đáy + scrim; "Nhà xe Hoàng Long (đã thôi hợp tác)") | Cỡ xe

    // ---- 1b
    const L = (type, tone, amt, reason, note, who, when, o = {}) => ({ type, amount: (amt < 0 ? '− ' : '+ ') + vnd(amt), color: amt < 0 ? 'var(--c-danger)' : 'var(--c-text)', reason, note, who, when, reversed: !!o.rev, trip: !!o.trip, op: o.rev ? 0.55 : 1, deco: o.rev ? 'line-through' : 'none', canReverse: !!o.can });
    const info = [{ k: 'NGÀY CHẠY', v: '04/10/2026' }, { k: 'BIỂN SỐ', v: '79A-123.45 · 16 chỗ' }, { k: 'ĐÓN', v: '07:30 · Sân bay Cam Ranh' }, { k: 'KHÁCH', v: '12 NL · 02 TE' }];
    const none = { carrier: 'Nhà xe Phúc Thành', route: 'Nha Trang – sân bay Cam Ranh', source: 'Chưa có giá', tone: 'warn', total: '—' };
    const s1 = { sum: none, noLines: true, warn: true, tripStatus: 'Chưa chạy' };
    const agreed = { title: 'Nhập giá thoả thuận', cta: 'Lưu giá thoả thuận', fields: [fld('Số tiền (₫)', '1.250.000', { req: 1, basis: '180px' }), fld('Ghi chú thoả thuận', 'Anh Thành báo giá điện thoại 02/10, đã chốt giá trọn gói', { req: 1, area: 1, basis: '260px' })] };
    const s1btn = [{ label: 'Nhập giá thoả thuận', variant: 'primary' }, { label: 'Lấy lại giá bảng', variant: 'default' }];
    const s1hint = 'Bảng giá vừa có giá 450.000 ₫ cho tuyến này — bấm “Lấy lại giá bảng” để dùng.';
    const s2 = { sum: { carrier: 'Nhà xe Phúc Thành', route: 'Nha Trang – sân bay Cam Ranh', source: 'Giá bảng', tone: 'ok', total: vnd(600000) },
      lines: [L('Giá bảng', 'ok', 450000, 'Giá bảng: Nha Trang – sân bay Cam Ranh · 10–16 khách', 'Áp từ 01/07/2026', 'Hệ thống', '02/10/2026 08:12', { can: 1 }), L('Điều chỉnh', 'soon', 150000, 'Phí cầu đường / bến bãi', 'Phí BOT theo biên lai', 'Lan Anh (Kế toán)', '04/10/2026 11:40', { can: 1 })], buttons: [{ label: 'Điều chỉnh', variant: 'primary' }], hint: 'Điều chỉnh cộng hoặc trừ vào tổng; ghi sai thì “Đảo dòng”.' };
    const adj = { title: 'Điều chỉnh chi phí', cta: 'Lưu điều chỉnh', error: 'Tổng chi phí chuyến sẽ âm — đảo điều chỉnh giảm trước',
      fields: [fld('Số tiền (+ hoặc −)', '− 700.000', { req: 1, err: 1, basis: '160px' }), fld('Lý do', 'Nhập sai', { req: 1, sel: 1, basis: '200px' }), fld('Ngày phát sinh', '02/10/2026 (hôm nay)', { req: 1 }), fld('Ghi chú', 'Giảm theo thoả thuận', { basis: '100%' })] };
    const s3 = { tripStatus: 'Đã huỷ', sum: { carrier: 'Nhà xe Phúc Thành', route: 'Nha Trang – sân bay Cam Ranh', source: 'Giá bảng', tone: 'ok', total: vnd(135000) },
      lines: [L('Giá bảng', 'ok', 400000, 'Giá bảng xe 10–16 khách', 'Xe cũ 79A-555.12', 'Hệ thống', '01/10/2026 09:00', { rev: 1, trip: 1 }), L('Đảo', 'gray', -400000, 'Đảo do đổi xe', '', 'Hệ thống', '02/10/2026 08:12', { trip: 1 }), L('Giá bảng', 'ok', 450000, 'Giá bảng xe 10–16 khách', '', 'Hệ thống', '02/10/2026 08:12', { rev: 1 }), L('Đảo', 'gray', -450000, 'Đảo do huỷ chuyến', '', 'Hệ thống', '03/10/2026 16:05'), L('Điều chỉnh', 'bad', 135000, 'Phí huỷ muộn', 'Huỷ trước giờ đón 14 tiếng — tính 30%', 'Lan Anh (Kế toán)', '03/10/2026 16:20', { can: 1 })], buttons: [{ label: 'Điều chỉnh', variant: 'primary' }], hint: 'Chuyến đã huỷ vẫn ghi được phí huỷ.' };
    // tripBoards: Máy tính 1040 · Chưa có giá, đang nhập giá thoả thuận (form agreed, nút s1btn, gợi ý s1hint) | Giá bảng + một điều chỉnh, báo tổng âm (form adj) | Chuyến đã huỷ có phí huỷ;
    //             Điện thoại 390 · Chưa có giá | Giá bảng + một điều chỉnh, dữ liệu đã đổi (Banner tải lại) | Chuyến đã huỷ có phí huỷ

    // ---- 1c
    const tr = (code, date, plate, route, st, tone, src, amt, adjN, rev) => {
      const np = st === 'Chưa có giá';
      return { code, date, plate, route, status: st, tone, source: src, amount: np ? 'Chưa có giá' : vnd(amt),
        adj: adjN ? (adjN > 0 ? '+ ' : '− ') + vnd(adjN) : '—', adjRev: rev ? rev + ' điều chỉnh bị đảo do đổi chuyến' : '', rowBg: np ? 'var(--c-sand-soft)' : '#fff' };
    };
    const raw = [
      { carrier: 'Nhà xe Phúc Thành', trips: [tr('TX-20261004-0007', '04/10', '79A-123.45', 'Nha Trang – sân bay Cam Ranh', 'Chưa chạy', 'soon', 'Giá bảng', 600000, 150000), tr('TX-20260930-0012', '30/09', '79A-123.45', 'Nha Trang – Vinpearl', 'Đã phát sinh', 'ok', 'Giá bảng', 350000, 0, 1), tr('TX-20260928-0004', '28/09', '79B-246.80', 'Nha Trang – Bình Ba', 'Đã phát sinh', 'ok', 'Giá thoả thuận', 1700000, 100000)] },
      { carrier: 'Nhà xe Minh Tâm', trips: [tr('TX-20261002-0003', '02/10', '79C-555.12', 'Nha Trang – Bình Ba', 'Đang chạy', 'run', 'Giá bảng', 1600000, 0), tr('TX-20261003-0009', '03/10', '79C-318.77', 'Nha Trang – Đầm Môn', 'Chưa có giá', 'warn', 'Chưa có giá', 0, 0), tr('TX-20260926-0002', '26/09', '79C-555.12', 'Nha Trang – sân bay Cam Ranh', 'Đã huỷ', 'bad', 'Giá bảng', 135000, 135000, 1)] }
    ];
    // LƯU Ý: bản vẽ tự CỘNG tổng nhóm / tổng cộng ở trình duyệt (num(), reduce) — app thật: web KHÔNG cộng, số do máy chủ trả.
    return { side, stmtSummary: '6 chuyến · 2 nhà xe · 1 chuyến chưa có giá', stmtNote: 'Chuyến chưa có giá chưa được tính.' };
  }
}
</script>
