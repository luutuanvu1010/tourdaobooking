<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/tour-o-booking-design-system-34f284df-c97a-4672-bb66-d7df03a0d97a/tokens/fonts.css">
<link rel="stylesheet" href="_ds/tour-o-booking-design-system-34f284df-c97a-4672-bb66-d7df03a0d97a/tokens/colors.css">
<link rel="stylesheet" href="_ds/tour-o-booking-design-system-34f284df-c97a-4672-bb66-d7df03a0d97a/styles.css">
<style>body{margin:0;background:#EAF2F8;font-family:'Nunito',sans-serif;color:#0F172A}a{color:#0C4A6E}a:hover{color:#082F49}</style>
</helmet>
<div style="max-width:1200px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px">
    <div>
      <h1 style="margin:0;font:800 24px 'Be Vietnam Pro',sans-serif;color:#0C4A6E">Lịch xe bận</h1>
      <div style="font-size:14px;color:#475569">{{ rangeLabel }} · {{ busyCount }} lịch bận</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button onClick="{{ prev }}" style="min-width:44px;height:44px;border:1px solid #D3E1EC;background:#fff;border-radius:8px;font-size:20px;cursor:pointer;color:#0C4A6E">‹</button>
      <button onClick="{{ today }}" style="height:44px;padding:0 16px;border:1px solid #D3E1EC;background:#fff;border-radius:8px;font:700 14px 'Nunito';cursor:pointer;color:#0C4A6E">Tuần này</button>
      <button onClick="{{ next }}" style="min-width:44px;height:44px;border:1px solid #D3E1EC;background:#fff;border-radius:8px;font-size:20px;cursor:pointer;color:#0C4A6E">›</button>
      <button onClick="{{ openForm }}" style="height:44px;padding:0 20px;border:0;background:#C0392B;color:#fff;border-radius:8px;font:700 16px 'Nunito';cursor:pointer">Thêm lịch bận</button>
    </div>
  </div>

  <sc-if value="{{ showForm }}" hint-placeholder-val="{{ false }}">
  <div style="background:#fff;border:1px solid #D3E1EC;border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end">
    <label style="display:flex;flex-direction:column;gap:4px;font:600 14px 'Nunito'">Xe
      <select value="{{ form.car }}" onChange="{{ setCar }}" style="height:44px;border:1px solid #D3E1EC;border-radius:8px;padding:0 8px;font:16px 'Nunito'">
        <sc-for list="{{ carOptions }}" as="c" hint-placeholder-count="3"><option value="{{ c }}">{{ c }}</option></sc-for>
      </select></label>
    <label style="display:flex;flex-direction:column;gap:4px;font:600 14px 'Nunito'">Ngày
      <input type="date" value="{{ form.date }}" onChange="{{ setDate }}" style="height:44px;border:1px solid #D3E1EC;border-radius:8px;padding:0 8px;font:16px 'Nunito'"></label>
    <label style="display:flex;flex-direction:column;gap:4px;font:600 14px 'Nunito'">Từ
      <input type="time" value="{{ form.from }}" onChange="{{ setFrom }}" style="height:44px;border:1px solid #D3E1EC;border-radius:8px;padding:0 8px;font:16px 'Nunito'"></label>
    <label style="display:flex;flex-direction:column;gap:4px;font:600 14px 'Nunito'">Đến
      <input type="time" value="{{ form.to }}" onChange="{{ setTo }}" style="height:44px;border:1px solid #D3E1EC;border-radius:8px;padding:0 8px;font:16px 'Nunito'"></label>
    <label style="display:flex;flex-direction:column;gap:4px;font:600 14px 'Nunito'">Lý do
      <input type="text" value="{{ form.note }}" onChange="{{ setNote }}" placeholder="Bảo dưỡng, đã có tour…" style="height:44px;border:1px solid #D3E1EC;border-radius:8px;padding:0 8px;font:16px 'Nunito'"></label>
    <div style="display:flex;gap:8px">
      <button onClick="{{ save }}" style="height:44px;padding:0 16px;border:0;background:#0C4A6E;color:#fff;border-radius:8px;font:700 16px 'Nunito';cursor:pointer">Lưu</button>
      <button onClick="{{ closeForm }}" style="height:44px;padding:0 16px;border:1px solid #D3E1EC;background:#fff;color:#0C4A6E;border-radius:8px;font:700 16px 'Nunito';cursor:pointer">Đóng</button>
    </div>
  </div>
  </sc-if>

  <div style="background:#fff;border:1px solid #D3E1EC;border-radius:12px;overflow:auto">
    <div style="min-width:860px;display:grid;grid-template-columns:150px repeat(7,minmax(0,1fr))">
      <div style="padding:12px;border-bottom:1px solid #D3E1EC;font:700 12px 'Nunito';letter-spacing:.08em;color:#475569">XE</div>
      <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
        <div style="padding:12px;border-bottom:1px solid #D3E1EC;border-left:1px solid #D3E1EC;background:{{ d.bg }}">
          <div style="font:700 12px 'Nunito';letter-spacing:.08em;color:#475569">{{ d.wd }}</div>
          <div style="font:800 16px 'Be Vietnam Pro',sans-serif;color:#0C4A6E">{{ d.label }}</div>
        </div>
      </sc-for>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
        <div style="padding:12px;border-bottom:1px solid #D3E1EC;display:flex;flex-direction:column;gap:2px">
          <div style="font:800 15px 'Be Vietnam Pro',sans-serif;color:#0C4A6E">{{ r.car }}</div>
          <div style="font-size:13px;color:#475569">{{ r.seats }}</div>
        </div>
        <sc-for list="{{ r.cells }}" as="cell" hint-placeholder-count="7">
          <div style="padding:8px;border-bottom:1px solid #D3E1EC;border-left:1px solid #D3E1EC;display:flex;flex-direction:column;gap:6px;min-height:72px;background:{{ cell.bg }}">
            <sc-for list="{{ cell.items }}" as="it" hint-placeholder-count="0">
              <div style="background:#FEF3C7;border-radius:8px;padding:6px 8px;font-size:13px;line-height:1.3;position:relative">
                <div style="font:800 13px 'Be Vietnam Pro',sans-serif;color:#0F172A">{{ it.time }}</div>
                <div style="color:#334155;padding-right:20px">{{ it.note }}</div>
                <button onClick="{{ it.remove }}" aria-label="Xoá" style="position:absolute;top:2px;right:2px;width:24px;height:24px;border:0;background:transparent;cursor:pointer;color:#475569;font-size:14px">✕</button>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </sc-for>
    </div>
  </div>
  <div style="font-size:14px;color:#475569;display:flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:4px;background:#FEF3C7;border:1px solid #D3E1EC"></span>Xe bận · ô trống là xe rảnh</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { off: 0, showForm: false, form: { car: '', date: '2026-10-03', from: '07:00', to: '17:00', note: '' },
    entries: [
      { id: 1, car: 'Xe 16 chỗ · 79A-123.45', date: '2026-10-02', from: '06:30', to: '16:00', note: 'Tour 4 đảo TD-20261002-0003' },
      { id: 2, car: 'Xe 29 chỗ · 79B-678.90', date: '2026-10-03', from: '00:00', to: '23:59', note: 'Bảo dưỡng định kỳ' },
      { id: 3, car: 'Xe 7 chỗ · 79A-555.12', date: '2026-10-04', from: '08:00', to: '12:00', note: 'Đón khách sân bay' },
      { id: 4, car: 'Xe 16 chỗ · 79A-123.45', date: '2026-10-05', from: '07:00', to: '17:30', note: 'Tour Vinpearl' }
    ] };
  cars = ['Xe 7 chỗ · 79A-555.12', 'Xe 16 chỗ · 79A-123.45', 'Xe 29 chỗ · 79B-678.90', 'Xe 45 chỗ · 79B-246.80'];
  iso(d) { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
  renderVals() {
    const s = this.state, base = new Date(2026, 9, 2);
    const dow = (base.getDay() + 6) % 7;
    const mon = new Date(2026, 9, 2 - dow + s.off * 7);
    const todayIso = this.iso(base), p = n => String(n).padStart(2, '0');
    const wds = ['THỨ 2', 'THỨ 3', 'THỨ 4', 'THỨ 5', 'THỨ 6', 'THỨ 7', 'CN'];
    const days = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); const k = this.iso(d);
      return { k, wd: wds[i], label: p(d.getDate()) + '/' + p(d.getMonth() + 1), bg: k === todayIso ? '#EAF2F8' : '#fff' }; });
    const rows = this.cars.map(car => { const [name, plate] = car.split(' · ');
      return { car: plate, seats: name, cells: days.map(d => ({ bg: d.bg,
        items: s.entries.filter(e => e.car === car && e.date === d.k).map(e => ({ time: e.from === '00:00' && e.to === '23:59' ? 'Cả ngày' : e.from + '–' + e.to, note: e.note || 'Bận',
          remove: () => this.setState(st => ({ entries: st.entries.filter(x => x.id !== e.id) })) })) })) }; });
    const last = days[6].k, first = days[0].k;
    const set = k => e => { const v = e.target.value; this.setState(st => ({ form: { ...st.form, [k]: v } })); };
    return { days, rows, carOptions: this.cars,
      rangeLabel: days[0].label + ' – ' + days[6].label + '/' + (mon.getFullYear()),
      busyCount: s.entries.filter(e => e.date >= first && e.date <= last).length,
      showForm: s.showForm, form: { ...s.form, car: s.form.car || this.cars[0] },
      prev: () => this.setState(st => ({ off: st.off - 1 })), next: () => this.setState(st => ({ off: st.off + 1 })), today: () => this.setState({ off: 0 }),
      openForm: () => this.setState({ showForm: true }), closeForm: () => this.setState({ showForm: false }),
      setCar: set('car'), setDate: set('date'), setFrom: set('from'), setTo: set('to'), setNote: set('note'),
      save: () => this.setState(st => ({ showForm: false, entries: [...st.entries, { id: Date.now(), ...st.form, car: st.form.car || this.cars[0] }] })) };
  }
}
</script>
</body>
</html>
